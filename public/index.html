<meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Macrolight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* MACROLIGHT — CALM PRECISION
   One idea runs through every screen: the graduated scale. Fine tick marks, like a kitchen scale or a
   measuring cup, carry calories, macros, water and history. Everything else stays quiet: warm paper,
   anthracite type, one deep forest green used sparingly.
   Layout: one phone column; on wide screens Today splits into instrument (left) and log (right). */
:root{
  /* surfaces — pairs written by the Design settings (--*-l light, --*-d dark) */
  --bg-l:#F7F7F4; --surface-l:#FDFDFA; --sunk-l:#EFEFEA; --line-l:#E3E3DC;
  --bg-d:#121311; --surface-d:#1B1C1A; --sunk-d:#252623; --line-d:#31322E;
  --accent-l:#536B57; --accent-d:#9DB8A1; --aink-l:#FFFFFF; --aink-d:#121311;
  --bg:var(--bg-l); --surface:var(--surface-l); --sunk:var(--sunk-l); --line:var(--line-l);
  --accent:var(--accent-l); --accent-ink:var(--aink-l);
  --ink:#20211F; --muted:#6B6D67; --tick:#C9CAC2;
  /* data colors: muted, distinct, never neon */
  --prot:#557089; --carb:#93723A; --fat:#9A6456; --water:#4A7A8B; --over:#8F6A40; --warn:#A0503A;
  --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --water-soft:color-mix(in srgb,var(--water) 16%,transparent);
  --shadow-float:0 1px 2px rgba(32,33,31,.06),0 10px 30px rgba(32,33,31,.10);
  --overlay:rgba(18,19,17,.32);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --r:14px; --r-sm:10px; --scale:1;
  /* glass style: three soft color fields behind frosted panels (written by the Design settings) */
  --m1-l:#C9E2D2; --m2-l:#C7DCE6; --m3-l:#DDE3C4; --m1-d:#21402F; --m2-d:#1F3843; --m3-d:#3A3F22;
  --m1:var(--m1-l); --m2:var(--m2-l); --m3:var(--m3-l);
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(251,251,252,.78); --glass-sunk:rgba(255,255,255,.5);
  --glass-edge:rgba(255,255,255,.8); --glass-line:rgba(32,33,31,.07);
  --glass-shadow:0 1px 1px rgba(32,33,31,.03),0 10px 32px rgba(32,33,31,.08);
  /* type scale = iOS text styles at the default text size, times the app's own size setting */
  --t-caption2:calc(.647rem * var(--scale));  /* 11 */
  --t-caption1:calc(.706rem * var(--scale));  /* 12 */
  --t-footnote:calc(.765rem * var(--scale));  /* 13 */
  --t-subhead:calc(.882rem * var(--scale));   /* 15 */
  --t-body:calc(1rem * var(--scale));         /* 17 */
  --t-title3:calc(1.176rem * var(--scale));   /* 20 */
  --t-title2:calc(1.294rem * var(--scale));   /* 22 */
  --t-title1:calc(1.647rem * var(--scale));   /* 28 */
  --t-display:calc(2.235rem * var(--scale));  /* 38 */
  --t-hero:calc(4.47rem * var(--scale));      /* 76 */
  --hit:44px;
  --ease:cubic-bezier(.22,.8,.24,1);
  --dur:240ms;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--bg-d); --surface:var(--surface-d); --sunk:var(--sunk-d); --line:var(--line-d);
  --accent:var(--accent-d); --accent-ink:var(--aink-d); --ink:#ECECE7; --muted:#9B9D96; --tick:#474943;
  --prot:#94AECB; --carb:#D6B477; --fat:#D69F92; --water:#8DBCCB; --over:#D2A773; --warn:#E08E72;
  --shadow-float:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.5); --m1:var(--m1-d); --m2:var(--m2-d); --m3:var(--m3-d);
  --glass:rgba(40,40,44,.46); --glass-strong:rgba(28,28,30,.76); --glass-sunk:rgba(255,255,255,.07);
  --glass-edge:rgba(255,255,255,.1); --glass-line:rgba(255,255,255,.05);
  --glass-shadow:0 1px 1px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.34); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--bg-d); --surface:var(--surface-d); --sunk:var(--sunk-d); --line:var(--line-d);
  --accent:var(--accent-d); --accent-ink:var(--aink-d); --ink:#ECECE7; --muted:#9B9D96; --tick:#474943;
  --prot:#94AECB; --carb:#D6B477; --fat:#D69F92; --water:#8DBCCB; --over:#D2A773; --warn:#E08E72;
  --shadow-float:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.5); --m1:var(--m1-d); --m2:var(--m2-d); --m3:var(--m3-d);
  --glass:rgba(40,40,44,.46); --glass-strong:rgba(28,28,30,.76); --glass-sunk:rgba(255,255,255,.07);
  --glass-edge:rgba(255,255,255,.1); --glass-line:rgba(255,255,255,.05);
  --glass-shadow:0 1px 1px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.34); color-scheme:dark}
/* the app's own Hell/Dunkel choice wins over the viewer setting */
html:root[data-look="light"]{
  --bg:var(--bg-l); --surface:var(--surface-l); --sunk:var(--sunk-l); --line:var(--line-l);
  --accent:var(--accent-l); --accent-ink:var(--aink-l); --ink:#20211F; --muted:#6B6D67; --tick:#C9CAC2;
  --prot:#557089; --carb:#93723A; --fat:#9A6456; --water:#4A7A8B; --over:#8F6A40; --warn:#A0503A;
  --shadow-float:0 1px 2px rgba(32,33,31,.06),0 10px 30px rgba(32,33,31,.10); --overlay:rgba(18,19,17,.32);
  --m1:var(--m1-l); --m2:var(--m2-l); --m3:var(--m3-l);
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(251,251,252,.78); --glass-sunk:rgba(255,255,255,.5);
  --glass-edge:rgba(255,255,255,.8); --glass-line:rgba(32,33,31,.07);
  --glass-shadow:0 1px 1px rgba(32,33,31,.03),0 10px 32px rgba(32,33,31,.08); color-scheme:light}
html:root[data-look="dark"]{
  --bg:var(--bg-d); --surface:var(--surface-d); --sunk:var(--sunk-d); --line:var(--line-d);
  --accent:var(--accent-d); --accent-ink:var(--aink-d); --ink:#ECECE7; --muted:#9B9D96; --tick:#474943;
  --prot:#94AECB; --carb:#D6B477; --fat:#D69F92; --water:#8DBCCB; --over:#D2A773; --warn:#E08E72;
  --shadow-float:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.5); --m1:var(--m1-d); --m2:var(--m2-d); --m3:var(--m3-d);
  --glass:rgba(40,40,44,.46); --glass-strong:rgba(28,28,30,.76); --glass-sunk:rgba(255,255,255,.07);
  --glass-edge:rgba(255,255,255,.1); --glass-line:rgba(255,255,255,.05);
  --glass-shadow:0 1px 1px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.34); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--t-body);line-height:1.35;letter-spacing:-.01em;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
::placeholder{color:var(--muted);opacity:1}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;display:none;background:radial-gradient(110% 50% at 50% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
html[data-grad="1"] #glow{display:block}
@media (prefers-contrast:more){html:root:root{--muted:color-mix(in srgb,var(--ink) 80%,var(--bg));--line:color-mix(in srgb,var(--ink) 38%,var(--bg));--tick:color-mix(in srgb,var(--ink) 45%,var(--bg))}}
@media (prefers-reduced-transparency:reduce){.dock{background:var(--surface)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}#glow{display:none!important}}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-block:6px 132px}
.view{display:flex;flex-direction:column}
.view.enter{animation:viewIn var(--dur) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}

/* ---------- type roles ---------- */
.eyebrow{font-size:var(--t-caption2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.title{font-family:var(--f-display);font-size:var(--t-title1);font-weight:600;letter-spacing:-.025em;line-height:1.1;margin:0}
.sub{font-size:var(--t-subhead);color:var(--muted)}
.unit{color:var(--muted);font-weight:400}

/* ---------- header ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 4px}
.head .sub{margin-top:3px}
.title .stop{display:none}
.title-sub{display:block;font-family:var(--f-body);font-size:var(--t-subhead);font-weight:400;letter-spacing:-.01em;color:var(--muted);margin-top:3px}
.store-only{display:none}
.daynav{display:flex;gap:2px;margin-bottom:-6px}
.icon-btn{width:var(--hit);height:var(--hit);display:grid;place-items:center;border:0;background:none;border-radius:50%;color:var(--ink);transition:background var(--dur),opacity var(--dur)}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{background:var(--sunk)}
.icon-btn:disabled{opacity:.25;cursor:default;background:none}
.title-btn{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;letter-spacing:inherit;position:relative}
.title-btn::before{content:"";position:absolute;inset:-8px -6px}

/* ---------- THE SCALE (signature) ---------- */
.scale{position:relative;height:var(--h,24px)}
.scale .ticks,.scale .fill{position:absolute;inset:0;
  background:
    linear-gradient(to right,var(--c) 0 1.5px,transparent 1.5px) 0 100% / calc(100% / var(--n)) 46% repeat-x,
    linear-gradient(to right,var(--c) 0 1.5px,transparent 1.5px) 0 100% / calc(100% / var(--n) * var(--major,5)) 100% repeat-x}
.scale .ticks{--c:var(--tick)}
.scale .fill{--c:var(--sc,var(--accent));clip-path:inset(0 100% 0 0);transition:clip-path 420ms var(--ease)}
.scale::after{content:"";position:absolute;right:0;bottom:0;width:1.5px;height:100%;background:var(--tick)}
.scale .mark{position:absolute;bottom:-5px;top:-7px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink);left:0;transition:left 420ms var(--ease)}
.scale.over .fill{--c:var(--over)}

/* ---------- hero: calories ---------- */
.hero{padding-block:26px 6px}
.hero-num{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:var(--t-hero);font-weight:300;letter-spacing:-.045em;line-height:.95;font-variant-numeric:tabular-nums}
.big-label{font-size:var(--t-body);color:var(--muted)}
.hero.over .big{color:var(--over)}
.hero .scale{--h:30px;--n:40;margin-top:22px}
.scale-legend{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:var(--t-footnote);color:var(--muted)}
.scale-legend b{font-weight:500;color:var(--ink)}

/* ---------- macros ---------- */
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px;padding-block:26px 24px;border-bottom:1px solid var(--line)}
.macro{min-width:0;display:flex;flex-direction:column;gap:6px}
.macro .val{font-size:var(--t-title3);font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.macro .val small{font-size:var(--t-footnote);font-weight:400;color:var(--muted);letter-spacing:0}
.macro .scale{--h:9px;--n:20;--major:10;margin-top:2px}
.m-p{--sc:var(--prot)} .m-c{--sc:var(--carb)} .m-f{--sc:var(--fat)}
.macro .eyebrow{display:flex;align-items:center;gap:6px}
.macro .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--sc);flex:none}

/* ---------- water ---------- */
.water{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:stretch;padding-block:22px;border-bottom:1px solid var(--line)}
.vessel{position:relative;width:46px;height:118px;border:1.5px solid var(--tick);border-top:0;border-radius:0 0 12px 12px;overflow:hidden}
.vessel .lvl{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--water-soft);border-top:1.5px solid var(--water);transition:height 520ms var(--ease)}
.vessel .grad{position:absolute;inset:0 auto 0 0;width:12px;
  background:linear-gradient(to top,var(--tick) 0 1.5px,transparent 1.5px) 0 100% / 100% calc(100% / var(--n,10)) repeat-y}
.vessel .grad::after{content:"";position:absolute;left:0;bottom:0;width:6px;height:100%;
  background:linear-gradient(to top,transparent 0 50%,var(--tick) 50% calc(50% + 1.5px),transparent calc(50% + 1.5px)) 0 100% / 100% calc(100% / var(--n,10)) repeat-y}
.w-top{display:flex;justify-content:space-between;align-items:center;margin:-12px -12px -10px 0}
.w-top .icon-btn{color:var(--muted)}
.w-top .icon-btn svg{width:18px;height:18px}
.w-info{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.w-amount{font-family:var(--f-display);font-size:var(--t-display);font-weight:300;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.w-amount .unit{font-size:var(--t-body);letter-spacing:0;margin-left:4px}
.w-goal{font-size:var(--t-footnote);color:var(--muted);margin-top:6px}
.w-goal.done{color:var(--water)}
.w-actions{display:flex;flex-wrap:nowrap;gap:6px;margin-top:12px}
.pill{min-height:36px;padding:0 12px;flex:none;border-radius:999px;border:0;background:var(--sunk);color:var(--ink);font-size:var(--t-subhead);font-weight:500;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px;transition:background var(--dur),transform 120ms;position:relative}
.pill::before{content:"";position:absolute;inset:-4px -2px}
.pill:active{transform:scale(.96)}
.pill.quiet{background:none;color:var(--muted);padding:0 6px;min-width:36px;justify-content:center}
.pill.quiet::before{inset:-4px}
.pill.quiet svg{width:18px;height:18px}
.pill:disabled{opacity:.35;cursor:default}

/* ---------- log (meals) ---------- */
.log{padding-top:26px}
.meal{margin-bottom:22px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px}
.meal-head .eyebrow{font-size:var(--t-caption1)}
.meal-head .kc{font-size:var(--t-footnote);color:var(--muted);font-variant-numeric:tabular-nums}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 6px 0 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.row-main{flex:1;min-width:0;border:0;background:none;padding:8px 0;text-align:left;color:inherit}
.row-title{font-size:var(--t-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:var(--t-footnote);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.row-val{font-size:var(--t-body);font-variant-numeric:tabular-nums;color:var(--ink)}
.row-val small{color:var(--muted);font-size:var(--t-footnote)}
.row.flash{animation:flash 1.1s var(--ease)}
@keyframes flash{0%,30%{background:var(--accent-soft)}}
.x-btn{width:var(--hit);height:var(--hit);border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:50%;flex:none;opacity:.7}
.x-btn svg{width:16px;height:16px}
.x-btn:active{background:var(--sunk)}
.add-row{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border:0;background:none;padding:0 16px;color:var(--accent);font-size:var(--t-body);text-align:left;position:relative}
.group>*+.add-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.add-row svg{width:18px;height:18px}
.add-row .ghost-copy{margin-left:auto;color:var(--muted);font-size:var(--t-footnote)}
.empty-add{background:none;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty-add span:first-of-type{color:var(--ink)}

/* ---------- dock: navigation + add ---------- */
.dock-wrap{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;justify-content:center;gap:10px;pointer-events:none;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.dock{pointer-events:auto;display:flex;gap:2px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow-float);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.tab{height:48px;min-width:64px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--t-caption2);font-weight:500;letter-spacing:.01em;transition:color var(--dur),background var(--dur)}
.tab svg{width:21px;height:21px}
.tab[aria-selected="true"]{color:var(--ink);background:var(--sunk)}
.tab[aria-selected="true"] svg{color:var(--accent)}
.add-fab{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow-float);transition:transform 140ms var(--ease)}
.add-fab svg{width:24px;height:24px}
.add-fab:active{transform:scale(.94)}

/* ---------- segmented control ---------- */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--sunk);border-radius:10px;padding:2px}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:8px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04);transform:translateX(calc(100% * var(--i)));transition:transform var(--dur) var(--ease)}
.seg button{position:relative;z-index:1;min-width:0;min-height:34px;border:0;background:none;border-radius:8px;font-size:var(--t-footnote);font-weight:500;color:var(--muted);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--dur)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg.small button{min-height:30px}
.ttabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:-4px}
.ttabs button{position:relative;border:0;background:none;padding:0;min-height:var(--hit);font-size:var(--t-subhead);font-weight:500;color:var(--muted);transition:color var(--dur)}
.ttabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:1px;background:var(--accent);transform:scaleX(0);transition:transform var(--dur) var(--ease)}
.ttabs button[aria-selected="true"]{color:var(--ink)}
.ttabs button[aria-selected="true"]::after{transform:scaleX(1)}

/* ---------- history ---------- */
.h-section{padding-block:24px;border-bottom:1px solid var(--line)}
.h-section:last-child{border-bottom:0}
.h-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.h-figure{font-family:var(--f-display);font-size:var(--t-display);font-weight:300;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.h-figure .unit{font-size:var(--t-body);letter-spacing:0;margin-left:4px}
.h-note{font-size:var(--t-footnote);color:var(--muted);margin-top:6px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10.5px;font-variant-numeric:tabular-nums}
.chart .t{stroke:var(--tick);stroke-width:1.2}
.chart .t.major{stroke-width:1.4}
.chart .goal{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4;opacity:.7}
.chart .line{fill:none;stroke:var(--accent);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--bg);stroke:var(--accent);stroke-width:1.5}
.chart .dot.sel{fill:var(--accent)}
.chart .dot.over{stroke:var(--over)}
.chart .dot.over.sel{fill:var(--over)}
.chart .dash{stroke:var(--water);stroke-width:1.6;stroke-linecap:round}
.chart .dash.dim{stroke:var(--tick)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .sel-lbl{fill:var(--ink);font-weight:600}
.weight-entry{display:flex;align-items:center;gap:8px;margin-top:18px;background:var(--surface);border-radius:var(--r);padding:4px 4px 4px 16px}
.weight-entry label{font-size:var(--t-subhead);color:var(--muted);flex:none}
.weight-entry input{flex:1;min-width:0;border:0;background:none;text-align:right;font-size:var(--t-title3);font-variant-numeric:tabular-nums;padding:10px 0;outline:none}
.weight-entry .unit{font-size:var(--t-body);margin-right:6px}
.weights{list-style:none;margin:14px 0 0;padding:0}
.weights li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:var(--t-subhead);font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
.weights li span:first-child{color:var(--muted)}
.weights .d{color:var(--muted);min-width:56px;text-align:right}

/* ---------- profile / settings ---------- */
.p-sec{margin-top:28px}
.p-sec>.eyebrow{display:block;margin:0 0 8px 16px}
.p-note{font-size:var(--t-footnote);color:var(--muted);margin:8px 16px 0}
.field-row{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;position:relative}
.group .field-row+.field-row::before,.group .field-row+.block::before,.group .block+.field-row::before,.group .block+.block::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.field-row>label,.field-row>.lab{flex:1;min-width:0;font-size:var(--t-body)}
.field-row input{width:96px;border:0;background:none;text-align:right;font-size:var(--t-body);font-variant-numeric:tabular-nums;color:var(--ink);padding:12px 0;outline:none}
.field-row input:focus{color:var(--accent)}
.field-row .unit{width:34px;font-size:var(--t-subhead)}
.field-row select{border:0;background:none;text-align:right;color:var(--muted);font-size:var(--t-body);padding:12px 0;max-width:60%;outline:none}
.block{padding:14px 16px;position:relative;display:flex;flex-direction:column;gap:10px}
.block .lab{font-size:var(--t-subhead);color:var(--muted)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--sunk);border:0;position:relative;flex:none;transition:background var(--dur)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.05);transition:transform var(--dur) var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:var(--hit);height:var(--hit);border-radius:50%;border:0;padding:0;position:relative;background:none;display:grid;place-items:center}
.sw i{width:30px;height:30px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid var(--ink)}
.sw.custom i{background:conic-gradient(#B05A4E,#B8954C,#6F8E5E,#4F7D93,#76618E,#B05A4E)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.bgopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bgopt{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:var(--t-caption1);color:var(--muted);min-height:var(--hit)}
.bgopt span{height:36px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
.bgopt[aria-pressed="true"]{color:var(--ink);font-weight:600}
.bgopt[aria-pressed="true"] span{box-shadow:inset 0 0 0 2px var(--accent)}
.fontopt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:52px;border:0;background:none;padding:0 16px;text-align:left;position:relative;color:var(--ink)}
.fontopt+.fontopt::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.fontopt .fn1{font-size:var(--t-title3);letter-spacing:-.01em}
.fontopt .fn2{font-size:var(--t-caption1);color:var(--muted);display:block}
.fontopt .chk{width:20px;height:20px;color:var(--accent);opacity:0}
.fontopt[aria-pressed="true"] .chk{opacity:1}
details.calc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:0 16px;color:var(--accent);font-size:var(--t-body)}
details.calc>summary::-webkit-details-marker{display:none}
details.calc>summary svg{width:16px;height:16px;transition:transform var(--dur) var(--ease)}
details.calc[open]>summary svg{transform:rotate(90deg)}
.calc-res{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.calc-res .h-figure{font-size:var(--t-title1)}
.text-btn{border:0;background:none;color:var(--accent);font-size:var(--t-body);font-weight:500;min-height:var(--hit);padding:0 4px}
.text-btn.wide{width:100%;text-align:left;padding:0 16px;min-height:50px}

/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade 200ms ease}
.sheet{width:100%;max-width:540px;max-height:94%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up 300ms var(--ease);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--tick);margin:7px auto 0;flex:none;touch-action:none;cursor:grab}
.sheet-head{display:grid;grid-template-columns:var(--hit) 1fr var(--hit);align-items:center;gap:6px;padding:4px 10px 6px;flex:none;touch-action:none}
.sheet-head h3{margin:0;text-align:center;font-size:var(--t-body);font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow-y:auto;padding:6px 20px 22px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sheet-body>*{flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:0 12px;min-height:40px}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font-size:var(--t-body);padding:9px 0;outline:none}
.list-label{font-size:var(--t-caption2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 16px}
.food{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:54px;border:0;background:none;padding:8px 16px;text-align:left;position:relative;color:var(--ink)}
.food+.food::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.food:active{background:var(--sunk)}
.food .fk{font-size:var(--t-subhead);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.inputs{background:var(--surface);border-radius:var(--r);overflow:hidden}
.inp{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;position:relative}
.inp+.inp::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.inp label{flex:none;color:var(--muted);font-size:var(--t-body);min-width:92px}
.inp input,.inp textarea{flex:1;min-width:0;border:0;background:none;font-size:var(--t-body);padding:13px 0;outline:none;color:var(--ink)}
.inp input.r{text-align:right;font-variant-numeric:tabular-nums}
.inp .unit{font-size:var(--t-subhead)}
.inp.area{align-items:flex-start}
.inp.area textarea{resize:none;min-height:84px;line-height:1.4}
.amount{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
.amount .big{font-size:var(--t-hero)}
.amount .macro-line{display:flex;gap:16px;font-size:var(--t-footnote);color:var(--muted);font-variant-numeric:tabular-nums}
.amount .macro-line b{color:var(--ink);font-weight:500}
.amount .macro-line i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.stepper{display:grid;grid-template-columns:var(--hit) 1fr var(--hit);align-items:center;gap:8px;background:var(--surface);border-radius:var(--r);padding:4px}
.stepper button{height:var(--hit);border:0;background:none;border-radius:10px;font-size:22px;color:var(--accent);font-weight:300}
.stepper button:active{background:var(--sunk)}
.stepper .sv{display:flex;align-items:baseline;justify-content:center;gap:4px}
.stepper input{width:5.5ch;border:0;background:none;text-align:right;font-size:var(--t-title2);font-variant-numeric:tabular-nums;padding:8px 0;outline:none}
.chipline{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chipline::-webkit-scrollbar{display:none}
.chipline .pill{flex:none}
.per100{font-size:var(--t-footnote);color:var(--muted);text-align:center;margin:0}
.primary{width:100%;min-height:50px;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-size:var(--t-body);font-weight:600;transition:transform 120ms,opacity var(--dur)}
.primary:active{transform:scale(.985)}
.primary:disabled{opacity:.4}
.secondary{width:100%;min-height:50px;border:0;border-radius:var(--r);background:var(--sunk);color:var(--ink);font-size:var(--t-body);font-weight:500}
.secondary:disabled{opacity:.45}
.secondary svg,.primary svg{width:19px;height:19px;vertical-align:-4px;margin-right:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.preset{border:0;background:var(--surface);border-radius:var(--r);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);transition:transform 120ms}
.preset:active{transform:scale(.96)}
.preset svg{width:24px;height:24px;color:var(--water)}
.preset b{font-size:var(--t-subhead);font-weight:500;font-variant-numeric:tabular-nums}
.preset span{font-size:var(--t-caption2);color:var(--muted)}
.drink{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 4px 0 16px;position:relative}
.drink+.drink::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.drink svg{width:18px;height:18px;color:var(--water)}
.drink .dt{flex:1;color:var(--muted);font-size:var(--t-footnote);font-variant-numeric:tabular-nums}
.est{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px;position:relative;cursor:pointer}
.est+.est::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.est input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--tick);margin:0;flex:none;display:grid;place-items:center;transition:background var(--dur),border-color var(--dur)}
.est input:checked{background:var(--accent);border-color:var(--accent)}
.est input:checked::after{content:"";width:6px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.est .em{flex:1;min-width:0}
.photo{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:var(--sunk)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-empty{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:16px;color:var(--muted);font-size:var(--t-footnote)}
.photo-empty svg{width:32px;height:32px;margin-bottom:6px;color:var(--ink);opacity:.5}
.photo-empty b{color:var(--ink);font-size:var(--t-subhead);font-weight:500}
.photo.busy::after{content:"";position:absolute;left:0;right:0;height:1.5px;top:0;background:var(--accent);box-shadow:0 0 0 6px var(--accent-soft);animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 2px)}}
.note{font-size:var(--t-footnote);color:var(--muted);margin:0}
.err{font-size:var(--t-footnote);color:var(--warn);margin:0}
.hint{font-size:var(--t-footnote);color:var(--ink);background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 12px;margin:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:var(--t-subhead);width:max-content;max-width:calc(100% - 40px);display:flex;align-items:center;gap:14px;animation:toastIn 200ms var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,6px)}}
.toast button{border:0;background:none;color:inherit;font-weight:600;padding:0;min-height:28px}

/* ---------- store layout (store and glass): two-tone headlines, large tiles, pill buttons ---------- */
html:is([data-style="store"],[data-style="glas"]){--tile-shadow:2px 4px 12px rgba(0,0,0,.08);--signal:#B64400}
@media (prefers-color-scheme:dark){html:is([data-style="store"],[data-style="glas"]):not([data-theme="light"]):not([data-look="light"]){--tile-shadow:none;--signal:#FF9F0A}}
html:is([data-style="store"],[data-style="glas"])[data-look="dark"],html:is([data-style="store"],[data-style="glas"])[data-theme="dark"]:not([data-look="light"]){--tile-shadow:none;--signal:#FF9F0A}
html:is([data-style="store"],[data-style="glas"]) .head{padding-block:22px 6px;align-items:flex-start}
html:is([data-style="store"],[data-style="glas"]) .title{font-size:var(--t-display);font-weight:600;letter-spacing:-.03em;line-height:1.1}
html:is([data-style="store"],[data-style="glas"]) .title .stop{display:inline}
html:is([data-style="store"],[data-style="glas"]) .title-sub{display:inline-block;white-space:nowrap;font:inherit;letter-spacing:inherit;color:var(--muted);margin:0}
html:is([data-style="store"],[data-style="glas"]) .daynav{margin:4px -8px 0 0}
html:is([data-style="store"],[data-style="glas"]) .daynav .icon-btn{background:radial-gradient(circle,var(--sunk) 0 17px,transparent 17.5px);color:var(--ink)}
html:is([data-style="store"],[data-style="glas"]) .daynav .icon-btn svg{width:17px;height:17px}
html:is([data-style="store"],[data-style="glas"]) .daynav .icon-btn:disabled{opacity:.35}
html:is([data-style="store"],[data-style="glas"]) .store-only{display:block}
html:is([data-style="store"],[data-style="glas"]) .sentence-h{font-family:var(--f-display);font-size:var(--t-title2);font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:30px 0 14px}
html:is([data-style="store"],[data-style="glas"]) .sentence-h span{color:var(--muted)}
html:is([data-style="store"],[data-style="glas"]) :is(.instrument,.h-section){background:var(--surface);border-radius:28px;box-shadow:var(--tile-shadow)}
html:is([data-style="store"],[data-style="glas"]) .instrument{padding:2px 24px;margin-top:14px}
html:is([data-style="store"],[data-style="glas"]) .instrument>section:last-child{border-bottom:0}
html:is([data-style="store"],[data-style="glas"]) .h-section{padding:24px;margin-top:14px;border-bottom:0}
html:is([data-style="store"],[data-style="glas"]) :is(.instrument,.h-section) .eyebrow{color:var(--signal)}
html:is([data-style="store"],[data-style="glas"]) .macro .eyebrow{color:var(--muted)}
html:is([data-style="store"],[data-style="glas"]) .big,html:is([data-style="store"],[data-style="glas"]) .w-amount,html:is([data-style="store"],[data-style="glas"]) .h-figure{font-weight:600;letter-spacing:-.035em}
html:is([data-style="store"],[data-style="glas"]) .hero{padding-top:24px}
html:is([data-style="store"],[data-style="glas"]) .log{padding-top:0}
html:is([data-style="store"],[data-style="glas"]) :is(.group,.inputs,.weight-entry,.stepper){border-radius:22px;box-shadow:var(--tile-shadow)}
html:is([data-style="store"],[data-style="glas"]) .preset{border-radius:18px;box-shadow:var(--tile-shadow)}
html:is([data-style="store"],[data-style="glas"]) .empty-add{box-shadow:none}
html:is([data-style="store"],[data-style="glas"]) :is(.primary,.secondary){border-radius:980px}
html:is([data-style="store"],[data-style="glas"]) .primary{font-weight:500}
html:is([data-style="store"],[data-style="glas"]) .seg{border-radius:980px}
html:is([data-style="store"],[data-style="glas"]) .seg-thumb,html:is([data-style="store"],[data-style="glas"]) .seg button{border-radius:980px}
html:is([data-style="store"],[data-style="glas"]) .dock{background:color-mix(in srgb,var(--surface) 80%,transparent);border:0;box-shadow:0 0 0 .5px rgba(0,0,0,.08),var(--shadow-float)}
html:is([data-style="store"],[data-style="glas"]) .add-fab{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 38%,transparent)}
@media (min-width:900px){html:is([data-style="store"],[data-style="glas"]) #view-today>.log{padding-top:14px}}

/* ---------- glass style ---------- */
html[data-style="glas"] #glow{display:block;background:
  radial-gradient(58% 40% at 8% 6%,var(--m1),transparent 70%),
  radial-gradient(52% 38% at 96% 22%,var(--m2),transparent 70%),
  radial-gradient(64% 42% at 26% 70%,var(--m3),transparent 72%),
  radial-gradient(50% 36% at 92% 92%,var(--m1),transparent 72%)}
html[data-style="glas"] :is(.instrument,.group,.inputs,.weight-entry,.stepper,.preset,.h-section){
  background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);
  box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 1px var(--glass-line),var(--glass-shadow)}

html[data-style="glas"] .instrument>section:last-child{border-bottom:0}
html[data-style="glas"] .instrument .macros,html[data-style="glas"] .instrument .water{border-bottom-color:var(--glass-line)}
html[data-style="glas"] :is(.instrument,.group,.inputs,.weight-entry,.stepper,.preset,.h-section){border:0}

html[data-style="glas"] .empty-add{border:1px dashed color-mix(in srgb,var(--muted) 35%,transparent);box-shadow:none;background:color-mix(in srgb,var(--glass) 55%,transparent)}
html[data-style="glas"] .row+.row::before,html[data-style="glas"] .group>*+.add-row::before,html[data-style="glas"] .food+.food::before,
html[data-style="glas"] .inp+.inp::before,html[data-style="glas"] .est+.est::before,html[data-style="glas"] .drink+.drink::before,html[data-style="glas"] .fontopt+.fontopt::before,
html[data-style="glas"] .group .field-row+.field-row::before,html[data-style="glas"] .group .field-row+.block::before,html[data-style="glas"] .group .block+.field-row::before,html[data-style="glas"] .group .block+.block::before{background:var(--glass-line)}
html[data-style="glas"] .pill:not(.quiet),html[data-style="glas"] .search,html[data-style="glas"] .secondary{background:var(--glass-sunk);box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 1px var(--glass-line)}
html[data-style="glas"] .seg{background:var(--glass-sunk);box-shadow:inset 0 0 0 1px var(--glass-line)}
html[data-style="glas"] .seg-thumb{background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-edge),0 1px 3px rgba(0,0,0,.1)}
html[data-style="glas"] .dock{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border:0;box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 1px var(--glass-line),var(--shadow-float)}
html[data-style="glas"] .tab[aria-selected="true"]{background:var(--glass-sunk);box-shadow:inset 0 1px 0 var(--glass-edge)}
html[data-style="glas"] .add-fab{background:color-mix(in srgb,var(--accent) 84%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);

<div id="glow"></div>
<div class="app">

        <div class="scale-legend num"><span><b id="eatenNum">0</b> gegessen</span><span>Ziel <b id="goalNum">2.000</b> kcal</span></div>
      </section>

function cacheWrite(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({days:state.days,settings:state.settings}))}catch(e){}}
function cacheRead(){try{const o=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(o){state.days={};Object.keys(o.days||{}).forEach(k=>state.days[k]=normDay(o.days[k]));state.settings=mergeSettings(o.settings)}}catch(e){}
  try{const v=localStorage.getItem("kalorienbuch-view");if(v==="today"||v==="history"||v==="me")state.view=v}catch(e){}}
const timers={},chains={};
function persist(docId,getBody){
  cacheWrite();
  if(state.mode!=="db")return;
  dirty.add(docId);
  clearTimeout(timers[docId]);
  timers[docId]=setTimeout(()=>{
    const ref=db.collection("data/users/"+userId).doc(docId);
    chains[docId]=(chains[docId]||Promise.resolve()).then(async()=>{
      try{await ref.set(getBody())}
      catch(e){
        if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await ref.set(getBody())}catch(e2){toast("Speichern fehlgeschlagen. Später erneut versuchen.")}}
        else if(e&&e.code==="quota_exceeded")toast("Speicher voll. Alte Tage löschen.");
        else toast("Speichern fehlgeschlagen.");
      }finally{dirty.delete(docId)}
    });
  },500);
}
const day=(d,create)=>{if(!state.days[d]){const o=normDay(null);if(!create)return o;state.days[d]=o}return state.days[d]};
function saveDay(date){const id="d-"+date;persist(id,()=>{const o=day(date);return{date,entries:o.entries,water:o.water,weight:o.weight}})}
function saveSettings(){persist("settings",()=>JSON.parse(JSON.stringify(state.settings)))}

async function connect(){
  if(!window.claude||!window.claude.use)return;
  const use=n=>window.claude.use(n).catch(()=>null);
  const [d,u,s,dl]=await Promise.all([use("db"),use("user"),use("sample"),use("downloads")]);
  sample=s;downloads=dl;
  if(sample&&sample.limits){try{const l=await sample.limits();imageCaps=l&&l.images||null}catch(e){imageCaps=null}}
  applyImageCaps();
  if(d&&u){try{userId=await u.id()}catch(e){userId=null}}
  if(d&&userId){
    db=d;state.mode="db";
    db.collection("data/users/"+userId).onSnapshot(snap=>{
      const days={};let settings=null;
      snap.docs.forEach(doc=>{const v=doc.data();if(!v)return;
        if(doc.id==="settings")settings=v;else if(doc.id.startsWith("d-"))days[doc.id.slice(2)]=normDay(JSON.parse(JSON.stringify(v)));});
      if(snap.empty&&!snap.metadata.fromCache&&Object.keys(state.days).length){
        // first run with the account store: move what this device kept into it
        Object.keys(state.days).forEach(saveDay);saveSettings();return;
      }
      Object.keys(days).forEach(k=>{if(!dirty.has("d-"+k))state.days[k]=days[k]});
      if(!snap.metadata.fromCache)Object.keys(state.days).forEach(k=>{if(!(k in days)&&!dirty.has("d-"+k))delete state.days[k]});
      if(settings&&!dirty.has("settings")){
        const migrated=!settings.look||settings.look.v!==KB.DEF_LOOK.v;
        state.settings=mergeSettings(settings);KB.applyLook(state.settings.look);
        if(migrated)saveSettings();
      }
      cacheWrite();renderAll(true);
    },()=>{state.mode="local"});
  }
  if(state.view==="me")renderMe();
  if(!$("overlay").hidden&&sheet.view==="add")drawSheet();
}

  const acc=imageCaps&&imageCaps.mediaTypes&&imageCaps.mediaTypes.length?imageCaps.mediaTypes.join(","):"image/*";

}

// ---------- small building blocks ----------
// numbers glide to their new value instead of jumping
function tween(el,to,fmt){
  const from=el.dataset.v==null?to:+el.dataset.v;el.dataset.v=to;
  if(from===to||reduceMotion()){el.textContent=fmt(to);return}
  const t0=performance.now(),d=320,run=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(k<1&&el.dataset.v==to)requestAnimationFrame(run)};
  requestAnimationFrame(run);
}
function setScale(el,ratio,over){
  const p=Math.max(0,Math.min(1,ratio))*100;
  el.querySelector(".fill").style.clipPath="inset(0 "+(100-p).toFixed(2)+"% 0 0)";
  const m=el.querySelector(".mark");if(m)m.style.left=p.toFixed(2)+"%";
  el.classList.toggle("over",!!over);
}

function lineChart(svg,days,vals,goal,opts){
  const W=340,H=+svg.getAttribute("viewBox").split(" ")[3],top=14,base=H-34,n=days.length,step=W/n,x=i=>i*step+step/2;
  const have=vals.filter(v=>v>0),max=Math.max(goal*1.15,...have,1),min=Math.min(...have,goal)*.72,y=v=>base-(v-min)/Math.max(max-min,1)*(base-top);
  let s='';
  // the scale along the bottom: one tick per day, a longer one per week
  days.forEach((d,i)=>{const dt=parseIso(d),major=n<=7||dt.getDay()===1;s+='<line class="t'+(major?" major":"")+'" x1="'+x(i).toFixed(1)+'" x2="'+x(i).toFixed(1)+'" y1="'+(base+10)+'" y2="'+(base+(major?18:14))+'"/>'});
  if(goal){const gy=y(goal).toFixed(1);s+='<line class="goal" x1="0" x2="'+W+'" y1="'+gy+'" y2="'+gy+'"/><text x="'+W+'" y="'+(+gy-5)+'" text-anchor="end">Ziel</text>'}
  // the line, broken where a day has nothing logged
  let seg=[];const flush=()=>{if(seg.length>1)s+='<polyline class="line" points="'+seg.join(" ")+'"/>';seg=[]};
  vals.forEach((v,i)=>{if(v>0)seg.push(x(i).toFixed(1)+","+y(v).toFixed(1));else flush()});flush();
  const sel=state.hSel&&days.includes(state.hSel)?state.hSel:[...days].reverse().find((d,i)=>vals[n-1-i]>0);
  vals.forEach((v,i)=>{if(v>0)s+='<circle class="dot'+(v>goal&&opts.overMark?" over":"")+(days[i]===sel?" sel":"")+'" cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="'+(days[i]===sel?4:(n>7?2:3))+'"/>'});
  const si=days.indexOf(sel);
  if(si>=0&&vals[si]>0){const lx=Math.min(Math.max(x(si),22),W-22);s+='<text class="sel-lbl" x="'+lx.toFixed(1)+'" y="'+(y(vals[si])-10).toFixed(1)+'" text-anchor="middle">'+opts.fmt(vals[si])+'</text>'}
  // first and last day under the scale
  const lbl=d=>{const dt=parseIso(d);return n<=7?dt.toLocaleDateString("de-DE",{weekday:"short"}).replace(".",""):dt.getDate()+"."+(dt.getMonth()+1)+"."};
  if(n<=7)days.forEach((d,i)=>{s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle"'+(d===sel?' class="sel-lbl"':'')+'>'+lbl(d)+'</text>'});
  else s+='<text x="'+x(0).toFixed(1)+'" y="'+(H-2)+'">'+lbl(days[0])+'</text><text x="'+x(n-1).toFixed(1)+'" y="'+(H-2)+'" text-anchor="end">'+lbl(days[n-1])+'</text>';
  days.forEach((d,i)=>{s+='<rect class="hit" data-day="'+d+'" x="'+(i*step).toFixed(1)+'" y="0" width="'+step.toFixed(1)+'" height="'+H+'"/>'});
  svg.innerHTML=s;
}
function waterChart(svg,days,vals,goal){
  // each day is a measuring column: one short dash per 250 ml
  const W=340,H=120,base=H-30,n=days.length,step=W/n,x=i=>i*step+step/2,unit=250,gap=n<=7?4.4:3,maxU=Math.max(Math.ceil(goal/unit),...vals.map(v=>Math.ceil(v/unit)),1),dh=Math.min(gap*2,(base-10)/maxU);
  const dw=n<=7?Math.min(20,step*.38):Math.max(3,step*.5);
  let s='';const gy=(base-Math.ceil(goal/unit)*dh+dh/2).toFixed(1);
  s+='<line class="goal" x1="0" x2="'+W+'" y1="'+gy+'" y2="'+gy+'"/>';
  days.forEach((d,i)=>{const k=Math.round(vals[i]/unit),cx=x(i);

function renderHistory(){

function renderWeight(){
  const all=Object.keys(state.days).filter(d=>typeof state.days[d].weight==="number").sort().map(d=>({d,v:state.days[d].weight}));
  const pts=all.slice(-30),tw=day(today()).weight;
  if(document.activeElement!==$("wIn"))$("wIn").value=tw!=null?nf1f.format(tw):"";
  const fd=d=>parseIso(d).toLocaleDateString("de-DE",{day:"numeric",month:"short"});
  if(!pts.length){$("weightNow").innerHTML="–";$("weightNote").textContent="Trag dein Gewicht ein, um die Entwicklung zu sehen.";$("weightHint").textContent="";$("weightChart").innerHTML="";$("weightChart").style.display="none";$("weightList").innerHTML="";return}
  const last=pts[pts.length-1],first=pts[0],delta=last.v-first.v;
  $("weightNow").innerHTML=nf1f.format(last.v)+'<span class="unit">kg</span>';
  $("weightNote").textContent=pts.length>1?(Math.abs(delta)<.05?"Unverändert":(delta>0?"+":"−")+nf1f.format(Math.abs(delta))+" kg")+" seit "+fd(first.d):"Erster Eintrag am "+fd(last.d);
  $("weightHint").textContent=fd(last.d);
  const svg=$("weightChart");
  if(pts.length<2){svg.style.display="none";svg.innerHTML=""}
  else{
    svg.style.display="";
    const W=340,H=120,top=16,base=H-26,mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v)),pad=Math.max(.5,(mx-mn)*.25);
    const t0=parseIso(first.d).getTime(),t1=parseIso(last.d).getTime(),X=p=>8+(t1===t0?.5:(parseIso(p.d).getTime()-t0)/(t1-t0))*(W-16),Y=v=>base-(v-(mn-pad))/((mx+pad)-(mn-pad))*(base-top);
    let s='';for(let i=0;i<=24;i++){const xx=8+i*(W-16)/24;s+='<line class="t'+(i%6===0?" major":"")+'" x1="'+xx.toFixed(1)+'" x2="'+xx.toFixed(1)+'" y1="'+(base+8)+'" y2="'+(base+(i%6===0?16:12))+'"/>'}
    s+='<polyline class="line" points="'+pts.map(p=>X(p).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ")+'"/>';
    pts.forEach((p,i)=>{s+='<circle class="dot'+(i===pts.length-1?" sel":"")+'" cx="'+X(p).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(i===pts.length-1?4:2.5)+'"/>'});
    s+='<text x="8" y="'+(H-2)+'">'+fd(first.d)+'</text><text x="'+(W-8)+'" y="'+(H-2)+'" text-anchor="end">'+fd(last.d)+'</text>';
    svg.innerHTML=s;
  }
  const rec=all.slice(-5).reverse();
  $("weightList").innerHTML=rec.map((p,i)=>{const prev=all[all.length-2-i],dl=prev?p.v-prev.v:null;
    return '<li><span>'+esc(fd(p.d))+'</span><span style="flex:1;text-align:right">'+nf1f.format(p.v)+' kg</span><span class="d">'+(dl==null?"":(Math.abs(dl)<.05?"±0,0":(dl>0?"+":"−")+nf1f.format(Math.abs(dl))))+'</span></li>'}).join("");
}

        h+='<div><div class="list-label">Schätzung · bitte prüfen</div><div class="group">'+sheet.est.map((e,i)=>'<label class="est"><input type="checkbox" data-est="'+i+'"'+(e.on?" checked":"")+'><span class="em"><div class="row-title">'+esc(e.name)+'</div><div class="row-sub">'+esc(e.menge||"")+(e.menge?" · ":"")+"E "+nf.format(e.p)+" · K "+nf.format(e.c)+" · F "+nf.format(e.f)+'</div></span><span class="row-val">'+nf.format(e.kcal)+'</span></label>').join("")+'</div></div>'+
          '<button class="primary" id="aiAdd">'+(n=>n===1?"1 Eintrag":n+" Einträge")(sheet.est.filter(e=>e.on).length)+' übernehmen · '+nf.format(sheet.est.filter(e=>e.on).reduce((a,e)=>a+e.kcal,0))+' kcal</button>';
      }
    }
    b.innerHTML=h;
    if(sheet.tab==="food"){drawFoods();const q=$("q");q.addEventListener("input",()=>{sheet.q=q.value;drawFoods()})}
    if(sheet.tab==="ai"){const t=$("aiText");t.addEventListener("input",()=>{sheet.estText=t.value})}
  }else if(sheet.view==="amount"){
    const f=sheet.food;$("sheetTitle").textContent=f.name;
    b.innerHTML=(sheet.editId?"":mealSeg(sheet.meal))+
      '<div class="amount"><span class="big num" id="amK">0</span><span class="sub">kcal</span><div class="macro-line num" id="amM"></div></div>'+
      '<div class="stepper"><button id="amMinus" aria-label="10 g weniger">−</button><div class="sv"><input id="amG" class="num" inputmode="decimal" aria-label="Menge in Gramm" value="'+sheet.grams+'"><span class="unit">g</span></div><button id="amPlus" aria-label="10 g mehr">+</button></div>'+
      '<div class="chipline">'+[[f.pg,"1 "+f.pl],[f.pg*2,"2 × "+f.pl],[50,"50 g"],[100,"100 g"],[200,"200 g"]].map(c=>'<button class="pill" data-g="'+c[0]+'">'+esc(c[1])+'</button>').join("")+'</div>'+
      '<p class="per100 num">je 100 g · '+nf.format(f.k)+' kcal · E '+nf1.format(f.p)+' · K '+nf1.format(f.c)+' · F '+nf1.format(f.f)+'</p>'+
      '<button class="primary" id="amSave">'+(sheet.editId?"Sichern":"Eintragen")+'</button>';
    const upd=()=>{const g=num($("amG").value);sheet.grams=g;const e=fromFood(f,g);tween($("amK"),e.kcal,v=>nf.format(v));
      $("amM").innerHTML='<span><i style="background:var(--prot)"></i>E <b>'+nf1.format(e.p)+'</b> g</span><span><i style="background:var(--carb)"></i>K <b>'+nf1.format(e.c)+'</b> g</span><span><i style="background:var(--fat)"></i>F <b>'+nf1.format(e.f)+'</b> g</span>';
      $("amSave").disabled=!(g>0)};
    $("amG").addEventListener("input",upd);
    $("amMinus").onclick=()=>{$("amG").value=Math.max(0,num($("amG").value)-10);upd()};
    $("amPlus").onclick=()=>{$("amG").value=num($("amG").value)+10;upd()};
    b.querySelectorAll("[data-g]").forEach(c=>c.onclick=()=>{$("amG").value=c.dataset.g;upd()});
    $("amSave").onclick=()=>{const e=fromFood(f,sheet.grams);
      if(sheet.editId)updateEntry(sheet.editId,e);else{addEntry({...e,meal:sheet.meal});if(sheet.photo){setPhoto(null);sheet.estText=""}}
      closeSheet()};
    upd();
  }else if(sheet.view==="editFixed"){
    const e=day(state.date).entries.find(x=>x.id===sheet.editId);if(!e){closeSheet();return}
    $("sheetTitle").textContent="Eintrag bearbeiten";
    b.innerHTML=segHTML(MEALS.map(m=>[m.id,m.short]),e.meal,"data-emeal")+'<div class="inputs">'+
      '<div class="inp"><label for="oName">Name</label><input id="oName" value="'+esc(e.name)+'"></div>'+
      '<div class="inp"><label for="oK">Kalorien</label><input id="oK" class="r" inputmode="decimal" value="'+e.kcal+'"><span class="unit">kcal</span></div>'+
      '<div class="inp"><label for="oP">Eiweiß</label><input id="oP" class="r" inputmode="decimal" value="'+(e.p||0)+'"><span class="unit">g</span></div>'+
      '<div class="inp"><label for="oC">Kohlenhydr.</label><input id="oC" class="r" inputmode="decimal" value="'+(e.c||0)+'"><span class="unit">g</span></div>'+
      '<div class="inp"><label for="oF">Fett</label><input id="oF" class="r" inputmode="decimal" value="'+(e.f||0)+'"><span class="unit">g</span></div></div>'+
      '<button class="primary" id="eSave">Sichern</button>';
    let meal=e.meal;
    b.querySelectorAll("[data-emeal]").forEach(c=>c.onclick=()=>{meal=c.dataset.emeal;pressSeg(c)});
    $("eSave").onclick=()=>{updateEntry(e.id,{name:$("oName").value.trim()||e.name,kcal:Math.round(num($("oK").value)),p:num($("oP").value),c:num($("oC").value),f:num($("oF").value),meal});closeSheet()};
  }else if(sheet.view==="water"){
    const o=day(state.date),w=waterSum(state.date),g=state.settings.water;
    $("sheetTitle").textContent="Trinken";
    b.innerHTML='<div class="amount" style="padding:0"><span class="big num" style="font-size:var(--t-display)">'+nf.format(w)+'<span class="unit" style="font-size:var(--t-body);margin-left:4px">ml</span></span><span class="sub num">von '+nf.format(g)+' ml</span></div>'+
      '<div class="presets">'+PRESETS.map(p=>'<button class="preset" data-water="'+p.ml+'">'+svgI(p.i)+'<b>'+p.ml+'</b><span>'+p.name+'</span></button>').join("")+'</div>'+
      '<div class="stepper"><button id="mlMinus" aria-label="50 ml weniger">−</button><div class="sv"><input id="mlIn" class="num" inputmode="numeric" aria-label="Eigene Menge in ml" value="'+sheet.ml+'"><span class="unit">ml</span></div><button id="mlPlus" aria-label="50 ml mehr">+</button></div>'+
      '<button class="primary" id="mlAdd">Hinzufügen</button>'+
      (o.water.length?'<div><div class="list-label">Heute</div><div class="group">'+o.water.slice().reverse().map(x=>'<div class="drink">'+svgI(iconForMl(x.ml))+'<span class="num">'+x.ml+' ml</span><span class="dt">'+new Date(x.t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+'</span><button class="x-btn" data-wdel="'+esc(x.id)+'" aria-label="'+x.ml+' ml entfernen">'+svgI("x")+'</button></div>').join("")+'</div></div>'
        :'<p class="note" style="text-align:center">Noch nichts getrunken.</p>');
    const ml=$("mlIn");ml.addEventListener("input",()=>{sheet.ml=num(ml.value)});
    $("mlMinus").onclick=()=>{ml.value=Math.max(0,num(ml.value)-50);sheet.ml=num(ml.value)};
    $("mlPlus").onclick=()=>{ml.value=num(ml.value)+50;sheet.ml=num(ml.value)};
    $("mlAdd").onclick=()=>{if(num(ml.value)>0){addWater(num(ml.value));drawSheet()}};
  }
}
function drawFoods(){
  const q=sheet.q.trim().toLowerCase(),box=$("foodres");if(!box)return;
  const row=(attr,name,sub,k)=>'<button class="food" '+attr+'><span style="min-width:0"><div class="row-title">'+esc(name)+'</div><div class="row-sub">'+esc(sub)+'</div></span><span class="fk">'+k+'</span></button>';
  let h="";
  const rec=recents().filter(e=>!q||e.name.toLowerCase().includes(q));
  if(rec.length)h+='<div><div class="list-label">Zuletzt</div><div class="group">'+rec.map(e=>row('data-recent="'+esc(e.name)+'"',e.name,e.per?"zuletzt "+nf.format(e.g)+" g":"1 Portion",e.per?nf.format(e.per.k)+" / 100 g":nf.format(e.kcal)+" kcal")).join("")+'</div></div>';
  const fs=FOODS.filter(f=>!q||f.name.toLowerCase().includes(q));
  if(fs.length)h+='<div style="margin-top:16px"><div class="list-label">Lebensmittel</div><div class="group">'+fs.map(f=>row('data-food="'+esc(f.name)+'"',f.name,"1 "+f.pl+" = "+f.pg+" g",nf.format(f.k)+" / 100 g")).join("")+'</div></div>';
  if(!h)h='<p class="note" style="text-align:center;padding:24px 0">Nichts gefunden. Trag es unter „Eigener“ ein'+(sample?' oder lass Claude schätzen':'')+'.</p>';
  box.innerHTML=h;
}
const toItem=x=>{const g=Math.max(0,Math.round(num(x.gramm))),it={name:String(x.name||"Unbekannt").slice(0,60),menge:String(x.menge||"").slice(0,40),kcal:Math.max(0,Math.round(num(x.kcal))),p:Math.max(0,num(x.protein)),c:Math.max(0,num(x.kohlenhydrate)),f:Math.max(0,num(x.fett)),g,on:true};
  if(g>0&&it.kcal>0)it.per={k:+(it.kcal/g*100).toFixed(1),p:+(it.p/g*100).toFixed(1),c:+(it.c/g*100).toFixed(1),f:+(it.f/g*100).toFixed(1),pg:g,pl:"Portion"};
  return it};
async function runEstimate(){
  const text=sheet.estText.trim(),photo=imageCaps?sheet.photo:null;
  if(!sample||(!text&&!photo))return;
  sheet.estBusy=true;sheet.estErr="";sheet.est=null;sheet.hint="";drawSheet();
  try{
    if(photo&&sheet.scanMode==="etikett"){
      const r=await sample.json(LABEL_PROMPT+(text?"\n\nHinweis vom Nutzer: "+text:""),{images:[photo]});
      if(!r||r.lesbar===false||!(num(r.kcal_100)>0)){sheet.estErr="Die Werte waren nicht lesbar. Fotografiere die Tabelle gerade, scharf und ohne Spiegelung.";return}
      const pg=Math.round(num(r.portion_g))||100;
      sheet.food={name:String(r.name||"Gescanntes Produkt").slice(0,60),k:Math.round(num(r.kcal_100)),p:+num(r.protein_100).toFixed(1),c:+num(r.kohlenhydrate_100).toFixed(1),f:+num(r.fett_100).toFixed(1),pg,pl:String(r.portion_name||"Portion").slice(0,20)};
      sheet.grams=pg;sheet.view="amount";drawSheet();return;
    }
    const opts=photo?{images:[photo]}:{modelTier:"quick"};
    const res=await sample.json(photo?PHOTO_PROMPT+(text?"\n\nZusatzinfo vom Nutzer: "+text:""):TEXT_PROMPT+text,opts);
    if(photo&&res&&res.essen===false){sheet.estErr="Auf dem Foto ist kein Essen zu erkennen. Versuch es mit einem anderen Bild.";return}
    const items=(res&&Array.isArray(res.items)?res.items:[]).map(toItem).filter(x=>x.kcal>0);
    sheet.est=items;sheet.hint=res&&typeof res.hinweis==="string"?res.hinweis.slice(0,200):"";
    if(!items.length)sheet.estErr=photo?"Claude konnte auf dem Foto nichts schätzen. Versuch ein helleres Bild von schräg oben.":"Claude konnte daraus nichts schätzen. Beschreibe die Mahlzeit genauer.";
  }catch(e){
    const c=e&&e.code;
    sheet.estErr=c==="rate_limited"?"Gerade zu viele Anfragen oder dein Nutzungslimit ist erreicht. Versuch es später erneut.":c==="not_granted"?"Claude ist für diese App nicht freigegeben.":c==="image_rejected"?"Dieses Bild geht nicht. Nimm ein JPEG- oder PNG-Foto.":c==="images_unavailable"?"Fotos gehen hier gerade nicht. Beschreib dein Essen stattdessen als Text.":c==="refused"?"Claude kann diese Anfrage nicht auswerten.":c==="session_expired"?"Bitte melde dich neu an und versuch es erneut.":"Schätzung fehlgeschlagen. Versuch es erneut.";
    if(c==="not_granted")sample=null;
    if(c==="images_unavailable"){imageCaps=null;applyImageCaps()}
  }finally{sheet.estBusy=false;if(!$("overlay").hidden&&sheet.view==="add")drawSheet()}
}
function onPicked(input){
  const file=input.files&&input.files[0];input.value="";if(!file)return;
  if(imageCaps&&imageCaps.maxInputBytes&&file.size>imageCaps.maxInputBytes){toast("Das Foto ist zu groß.");return}
  setPhoto(file);
  if($("overlay").hidden||sheet.view!=="add"||sheet.tab!=="ai"){openSheet("add",{tab:"ai"})}else drawSheet();
  runEstimate();
}

$("prevDay").onclick=()=>{state.date=addDays(state.date,-1);renderToday()};

$("galIn").addEventListener("change",()=>onPicked($("galIn")));

});
["kcalChart","waterChart"].forEach(id=>$(id).addEventListener("click",e=>{const g=e.target.closest("[data-day]");if(!g)return;
  if(state.hSel===g.dataset.day){state.date=g.dataset.day;renderToday();showView("today",true)}else{state.hSel=g.dataset.day;renderHistory()}}));
$("rangeSeg").addEventListener("click",e=>{const b=e.target.closest("[data-range]");if(b){pressSeg(b);state.range=+b.dataset.range;renderHistory()}});
const saveWeight=()=>{const v=num($("wIn").value);if(!(v>20&&v<400)){toast("Bitte ein Gewicht in kg eingeben");return}
  day(today(),true).weight=Math.round(v*10)/10;saveDay(today());$("wIn").blur();renderWeight()};
$("wSave").onclick=saveWeight;
$("wIn").addEventListener("keydown",e=>{if(e.key==="Enter")saveWeight()});
$("meBody").addEventListener("click",e=>{
  const t=e.target;
  const lk=t.closest("[data-lk]");if(lk){if(lk.closest(".seg"))pressSeg(lk);setLook({[lk.dataset.lk]:lk.dataset.val});if(!lk.closest(".seg")||lk.dataset.lk==="style")renderMe();return}
  const lt=t.closest("[data-look-toggle]");if(lt){const k=lt.dataset.lookToggle;setLook({[k]:!state.settings.look[k]});lt.setAttribute("aria-checked",String(!!state.settings.look[k]));return}
  const sh=t.closest("[data-show]");if(sh){const k=sh.dataset.show;state.settings.show={...state.settings.show,[k]:!state.settings.show[k]};sh.setAttribute("aria-checked",String(state.settings.show[k]));saveSettings();renderToday();return}
  if(t.closest("#resetLook")){setLook({...KB.DEF_LOOK});renderMe();toast("Darstellung zurückgesetzt");return}
  if(t.closest("#exportCsv"))exportCsv();
});
$("meBody").addEventListener("input",e=>{if(e.target.id==="customColor")KB.applyLook({...state.settings.look,accent:e.target.value})});
$("meBody").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="customColor"){setLook({accent:t.value});renderMe();return}
  if(t.dataset.goal){const k=t.dataset.goal,v=Math.round(num(t.value)),min=k==="goal"?800:k==="water"?250:0;
    if(!(v>=min)){t.value=state.settings[k];toast(k==="goal"?"Bitte mindestens 800 kcal eingeben":k==="water"?"Bitte mindestens 250 ml eingeben":"Bitte eine Zahl eingeben");return}
    state.settings[k]=v;saveSettings();renderToday()}
});
$("sheetBody").addEventListener("click",e=>{
  const t=e.target;
  const m=t.closest("[data-meal]");if(m){sheet.meal=m.dataset.meal;pressSeg(m);return}
  const tb=t.closest("[data-tab]");if(tb){sheet.tab=tb.dataset.tab;drawSheet();return}
  const pk=t.closest("[data-pick]");if(pk){$(pk.dataset.pick).click();return}
  const sm=t.closest("[data-scanmode]");if(sm){if(sheet.scanMode!==sm.dataset.scanmode){sheet.scanMode=sm.dataset.scanmode;sheet.est=null;sheet.hint="";sheet.estErr=""}drawSheet();return}
  const wp=t.closest("[data-water]");if(wp){addWater(+wp.dataset.water);drawSheet();return}
  const wd=t.closest("[data-wdel]");if(wd){removeWater(wd.dataset.wdel);drawSheet();return}
  const fd=t.closest("[data-food]");if(fd){const f=FOODS.find(x=>x.name===fd.dataset.food);sheet.food=f;sheet.grams=f.pg;sheet.view="amount";drawSheet();return}
  const rc=t.closest("[data-recent]");if(rc){const r=recents().find(x=>x.name===rc.dataset.recent);if(!r)return;
    if(r.per){sheet.food={name:r.name,...r.per};sheet.grams=r.g;sheet.view="amount";drawSheet()}
    else{addEntry({name:r.name,kcal:r.kcal,p:r.p,c:r.c,f:r.f,meal:sheet.meal});closeSheet()}return}
  if(t.closest("#oAdd")){const n=$("oName").value.trim(),k=Math.round(num($("oK").value));
    if(!n||!(k>0)){toast("Bitte Name und Kalorien angeben");return}
    addEntry({name:n,kcal:k,p:num($("oP").value),c:num($("oC").value),f:num($("oF").value),meal:sheet.meal});closeSheet();return}
  if(t.closest("#aiGo")){runEstimate();return}
  if(t.closest("#aiAdd")){const sel=sheet.est.filter(x=>x.on);sel.forEach(x=>addEntry({name:x.name,kcal:x.kcal,p:x.p,c:x.c,f:x.f,meal:sheet.meal,...(x.per?{g:x.g,per:x.per}:{})}));
    sheet.est=null;sheet.estText="";setPhoto(null);closeSheet();return}
});
$("sheetBody").addEventListener("change",e=>{const c=e.target.closest("[data-est]");if(c){sheet.est[+c.dataset.est].on=c.checked;drawSheet()}});

let toastTimer;
function toast(msg,undo){
  const el=$("toast");clearTimeout(toastTimer);el.innerHTML="";el.hidden=true;void el.offsetWidth;
  const s=document.createElement("span");s.textContent=msg;el.appendChild(s);
  if(undo){const b=document.createElement("button");b.textContent="Widerrufen";b.onclick=()=>{undo();el.hidden=true};el.appendChild(b)}
  el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,undo?4500:2200);
}

// drag the grabber or header down to dismiss the sheet
(function(){
  const sh=document.querySelector(".sheet");let y0=null,dy=0,t0=0;
  const down=e=>{if(e.target.closest("button"))return;y0=e.clientY;dy=0;t0=Date.now();sh.style.transition="none"};
  const move=e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform="translateY("+dy+"px)"};
  const up=()=>{if(y0==null)return;y0=null;const fast=dy>30&&dy/Math.max(1,Date.now()-t0)>.5;
    sh.style.transition="transform .2s cubic-bezier(.2,.8,.2,1)";
    if(dy>110||fast){sh.style.transform="translateY(100%)";setTimeout(closeSheet,200)}else sh.style.transform=""};
  [".grab",".sheet-head"].forEach(q=>document.querySelector(q).addEventListener("pointerdown",down));
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
})();
