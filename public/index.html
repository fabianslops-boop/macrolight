<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Kalorien, Makros und Trinkmenge im Blick – mit Verlauf, Gewichtskurve und anpassbarem Design.">
<meta name="theme-color" content="#F1F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kalorienbuch">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Kalorienbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone column with three tabs (Heute · Verlauf · Profil) over a fixed bottom tab bar; adding happens in a bottom sheet.
   Theming: surface and accent tokens resolve from --*-l / --*-d pairs that the viewer's Design settings write onto :root. */
:root{
  --bg-l:#F1F4F1; --surface-l:#FFFFFF; --sunk-l:#E7ECE8; --line-l:#DCE2DD;
  --bg-d:#111513; --surface-d:#1A1F1C; --sunk-d:#232A26; --line-d:#2B332E;
  --accent-l:#B8336A; --accent-d:#EE6D9F; --aink-l:#FFFFFF; --aink-d:#1A0D13;
  --bg:var(--bg-l); --surface:var(--surface-l); --sunk:var(--sunk-l); --line:var(--line-l);
  --accent:var(--accent-l); --accent-ink:var(--aink-l);
  --ink:#17201B; --muted:#626D66;
  --prot:#2D76C8; --carb:#C98A12; --fat:#2F8F62; --water:#1F72BF; --warn:#C8410C;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.07);
  --accent-soft:color-mix(in srgb,var(--accent) 15%,var(--surface));
  --water-soft:color-mix(in srgb,var(--water) 14%,var(--surface));
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-sm:12px; --scale:1;
  /* type scale = iOS text styles at the default text size (pt), times the app's own size setting */
  --t-caption2:calc(.647rem * var(--scale));  /* 11 */
  --t-caption1:calc(.706rem * var(--scale));  /* 12 */
  --t-footnote:calc(.765rem * var(--scale));  /* 13 */
  --t-subhead:calc(.882rem * var(--scale));   /* 15 */
  --t-body:calc(1rem * var(--scale));         /* 17 */
  --t-title3:calc(1.176rem * var(--scale));   /* 20 */
  --t-title2:calc(1.294rem * var(--scale));   /* 22 */
  --t-title1:calc(1.647rem * var(--scale));   /* 28 */
  --t-large:calc(2rem * var(--scale));        /* 34 */
  --t-hero:calc(2.588rem * var(--scale));     /* 44 */
  --hit:44px;                                  /* minimum touch target */
  --overlay:rgba(10,15,12,.45);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--bg-d); --surface:var(--surface-d); --sunk:var(--sunk-d); --line:var(--line-d);
  --accent:var(--accent-d); --accent-ink:var(--aink-d); --ink:#ECF1ED; --muted:#9AA59F;
  --prot:#6CA8EE; --carb:#EDBA4C; --fat:#5BC28F; --water:#5FB2F6; --warn:#FF8A55;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--bg-d); --surface:var(--surface-d); --sunk:var(--sunk-d); --line:var(--line-d);
  --accent:var(--accent-d); --accent-ink:var(--aink-d); --ink:#ECF1ED; --muted:#9AA59F;
  --prot:#6CA8EE; --carb:#EDBA4C; --fat:#5BC28F; --water:#5FB2F6; --warn:#FF8A55;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
/* the app's own Hell/Dunkel choice wins over the viewer setting */
html:root[data-look="light"]{
  --bg:var(--bg-l); --surface:var(--surface-l); --sunk:var(--sunk-l); --line:var(--line-l);
  --accent:var(--accent-l); --accent-ink:var(--aink-l); --ink:#17201B; --muted:#626D66;
  --prot:#2D76C8; --carb:#C98A12; --fat:#2F8F62; --water:#1F72BF; --warn:#C8410C;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.07); color-scheme:light}
html:root[data-look="dark"]{
  --bg:var(--bg-d); --surface:var(--surface-d); --sunk:var(--sunk-d); --line:var(--line-d);
  --accent:var(--accent-d); --accent-ink:var(--aink-d); --ink:#ECF1ED; --muted:#9AA59F;
  --prot:#6CA8EE; --carb:#EDBA4C; --fat:#5BC28F; --water:#5FB2F6; --warn:#FF8A55;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
::placeholder{color:var(--muted);opacity:1}
@media (prefers-contrast:more){html:root:root{--muted:color-mix(in srgb,var(--ink) 82%,var(--surface));--line:color-mix(in srgb,var(--ink) 40%,var(--surface))}.card,.kpi{box-shadow:0 0 0 1px var(--line)}}
@media (prefers-reduced-transparency:reduce){.tabbar{background:var(--surface)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}html[data-grad="1"] .top{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}#glow{display:none!important}}
html{font-size:17px}
/* WebKit (iPhone, Claude app): follow the system text size (Dynamic Type) */
@supports (font:-apple-system-body){html{font:-apple-system-body}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--t-body);line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;display:none;background:radial-gradient(120% 55% at 50% -8%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 72%)}
html[data-grad="1"] #glow{display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-block:8px 170px}
.view{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{text-wrap:balance}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 6px}
html[data-grad="1"] .top{background:transparent;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{font-family:var(--f-display);font-weight:800;font-size:var(--t-title3);letter-spacing:-.02em;margin:0}
.brand span{color:var(--accent)}
.datebar{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:0}
.datebar button{border:0;background:transparent;width:var(--hit);height:var(--hit);border-radius:calc(var(--r-sm) - 3px);display:grid;place-items:center}
.datebar button:hover{background:var(--sunk)}
.datebar button:disabled{opacity:.3;cursor:default;background:transparent}
.datelabel{min-width:112px;text-align:center;font-weight:600;font-size:var(--t-subhead);line-height:1.15;border:0;background:none;padding:0}
.datelabel small{display:block;color:var(--muted);font-weight:500;font-size:var(--t-caption2)}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.sec{margin:0 0 12px;font-family:var(--f-display);font-weight:700;font-size:var(--t-body);letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec small{font-family:var(--f-body);font-weight:500;font-size:var(--t-caption1);color:var(--muted)}

/* summary */
.summary{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;align-items:center}
.ring{position:relative;width:calc(8.7rem * var(--scale));height:calc(8.7rem * var(--scale));flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--sunk)}
/* meal tones: accent blended toward the text color, so all four stay distinct from the track */
.arc{fill:none;stroke-width:11;stroke:color-mix(in srgb,var(--accent) var(--mix),var(--ink));animation:arcIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes arcIn{from{stroke-dasharray:0 400}}
.ring.over .arc{stroke:color-mix(in srgb,var(--warn) var(--mix),var(--ink))}
.m0{--mix:100%} .m1{--mix:72%} .m2{--mix:50%} .m3{--mix:32%}
.mdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--accent) var(--mix),var(--ink));margin-right:8px;vertical-align:1px}
.ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-num{font-family:var(--f-display);font-weight:800;font-size:var(--t-large);letter-spacing:-.03em;line-height:1}
.ring.over .ring-num{color:var(--warn)}
.ring-cap{font-size:var(--t-caption2);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px;font-weight:600}
.stats{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1 1 calc(8rem * var(--scale))}
.statrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 8px;font-size:var(--t-footnote);color:var(--muted)}
.statrow b{color:var(--ink);font-weight:700;font-size:var(--t-subhead)}
.macro{display:flex;flex-direction:column;gap:4px}
.macro-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 8px;font-size:var(--t-caption1);color:var(--muted)}
.macro-head b{color:var(--ink);font-weight:600}
.meter{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;transition:width .5s}
.m-p i{background:var(--prot)} .m-c i{background:var(--carb)} .m-f i{background:var(--fat)}

/* water */
.water{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center}
.w-vis svg{width:62px;height:auto;display:block}
.w-bg{fill:var(--water-soft)}
.w-fill{fill:var(--water);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.w-outline{fill:none;stroke:var(--water);stroke-width:2.5;stroke-linejoin:round}
.w-ticks line{stroke:var(--surface);stroke-width:1.5;opacity:.7}
.w-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.w-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.w-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:var(--t-body)}
.w-pct{font-size:var(--t-caption1);font-weight:700;color:var(--water)}
.w-num{font-size:var(--t-footnote);color:var(--muted)}
.w-num b{font-family:var(--f-display);font-size:var(--t-title1);font-weight:800;color:var(--ink);letter-spacing:-.02em}
.w-quick{display:flex;gap:6px;flex-wrap:wrap}
.wbtn{display:flex;align-items:center;gap:4px;border:0;background:var(--water-soft);color:var(--ink);border-radius:999px;min-height:var(--hit);padding:0 12px 0 10px;font-size:var(--t-footnote);font-weight:700}
.wbtn svg{width:16px;height:16px;color:var(--water)}
.wbtn:hover{background:color-mix(in srgb,var(--water) 24%,var(--surface))}
.wbtn.icon{padding:0 12px;min-width:var(--hit);justify-content:center}
.wbtn:disabled{opacity:.4;cursor:default}

/* meals */
.meal{padding:0;overflow:hidden}
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px}
.meal-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:var(--t-body);letter-spacing:-.01em}
.meal-head .kc{font-weight:700;font-size:var(--t-subhead)}
.meal-head .kc small{color:var(--muted);font-weight:500}
.entries{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 6px 6px 16px;border-top:1px solid var(--line)}
.entry-main{min-width:0;border:0;background:none;text-align:left;padding:0}
.entry-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-sub{font-size:var(--t-caption1);color:var(--muted)}
.entry-k{font-weight:700;font-size:var(--t-subhead)}
.del{width:var(--hit);height:var(--hit);border-radius:var(--r-sm);border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.del:hover{background:var(--sunk);color:var(--warn)}
.addrow{display:flex;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 16px;color:var(--accent);font-weight:600;text-align:left}
.addrow:hover{background:var(--sunk)}
.empty-hint{padding:0 16px 12px;color:var(--muted);font-size:var(--t-footnote);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.copybtn{border:1px dashed var(--line);background:transparent;border-radius:999px;min-height:var(--hit);padding:0 14px;font-size:var(--t-caption1);font-weight:600;color:var(--ink)}
.copybtn:hover{border-color:var(--accent);color:var(--accent)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .sel text.lbl{fill:var(--ink);font-weight:700}
.chart .bg{fill:var(--sunk)}
.chart .v{fill:var(--accent)}
.chart .v.over{fill:var(--warn)}
.chart.waterc .v{fill:var(--water)}
.chart .goal{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1}
.chart g.day{cursor:pointer}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .wline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .warea{fill:var(--accent);opacity:.12}
.chart .wdot{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.kpi span{display:block;font-size:var(--t-caption2);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi b{display:block;font-family:var(--f-display);font-weight:800;font-size:var(--t-title2);letter-spacing:-.02em;margin-top:2px}
.kpi small{font-size:var(--t-caption1);color:var(--muted)}
.wrow{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.wrow .field{flex:1}
.wdelta{font-size:var(--t-footnote);color:var(--muted)}
.wdelta b{color:var(--ink)}
.note{font-size:var(--t-caption1);color:var(--muted);text-align:center;margin:0}

/* profile */
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row-l{min-width:0}
.row-l b{display:block;font-weight:600}
.row-l span{font-size:var(--t-caption1);color:var(--muted)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);border:0;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.group{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.group:first-of-type{border-top:0;padding-top:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:var(--hit);height:var(--hit);border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.sw.custom{display:grid;place-items:center;background:conic-gradient(#E5484D,#F5A524,#46A758,#0091FF,#8E4EC6,#E5484D);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.sw.custom svg{width:18px;height:18px;color:#FFFFFF;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.bgopts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bgopt{border:1px solid var(--line);background:none;border-radius:var(--r-sm);padding:5px 5px 6px;display:flex;flex-direction:column;gap:5px;align-items:stretch;font-size:var(--t-caption2);font-weight:600;color:var(--muted);min-width:0}
.bgopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--ink)}
.bgprev{height:42px;border-radius:calc(var(--r-sm) - 4px);display:flex;align-items:center;justify-content:center;padding:6px}
.bgprev i{display:block;width:100%;height:14px;border-radius:4px}
@media (max-width:380px){.bgopts{grid-template-columns:repeat(3,1fr)}}
.fontopts{display:flex;flex-direction:column;gap:8px}
.fontopt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:none;border-radius:var(--r-sm);padding:10px 12px;text-align:left}
.fontopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fontopt .fs1{font-size:var(--t-title3);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.fontopt .fs2{font-size:var(--t-caption1);color:var(--muted)}
.fontopt .fnum{font-size:var(--t-title3);font-weight:800}

/* tab bar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:var(--r-sm);color:var(--muted);font-size:var(--t-caption2);font-weight:700;letter-spacing:.02em}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] svg{fill:color-mix(in srgb,currentColor 22%,transparent)}
.fabs{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;align-items:center}
.fabcam{width:54px;height:54px;border-radius:27px;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.fabcam svg{width:24px;height:24px}
.fab{height:54px;padding:0 20px 0 16px;border-radius:27px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:var(--t-body);display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:22px;height:22px}

/* sheet */
.overlay{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:520px;max-height:92%;background:var(--surface);border-radius:calc(var(--r) + 4px) calc(var(--r) + 4px) 0 0;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 0;flex:none;touch-action:none;cursor:grab}
.sheet-head{touch-action:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex:none}
.sheet-head h3{margin:0;flex:1;font-family:var(--f-display);font-weight:700;font-size:var(--t-title3);min-width:0}
.iconbtn{width:var(--hit);height:var(--hit);border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.sheet-body{overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sheet-body>*{flex-shrink:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:var(--hit);padding:0 14px;font-size:var(--t-footnote);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:flex;background:var(--sunk);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;min-width:0;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);min-height:40px;padding:4px 6px;font-size:var(--t-footnote);font-weight:600;color:var(--muted)}
.seg .mdot{width:8px;height:8px;margin-right:5px}
@media (max-width:380px){.seg .mdot{display:none}}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:var(--t-caption1);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:11px 12px;font-size:var(--t-body)}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.input{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.foodlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.food{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.food:hover{background:var(--sunk)}
.food .fn{font-weight:600;min-width:0}
.food .fs{font-size:var(--t-caption1);color:var(--muted)}
.food .fk{font-weight:700;font-size:var(--t-footnote);white-space:nowrap}
.listlabel{font-size:var(--t-caption1);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.btn{border:0;border-radius:var(--r-sm);padding:14px 16px;font-weight:700;font-size:var(--t-body);background:var(--accent);color:var(--accent-ink);width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.small{width:auto;padding:11px 16px;font-size:var(--t-subhead)}
.bigk{text-align:center;padding:6px 0}
.bigk .n{font-family:var(--f-display);font-weight:800;font-size:var(--t-hero);letter-spacing:-.03em;line-height:1}
.bigk .u{color:var(--muted);font-weight:600}
.mline{display:flex;justify-content:center;gap:14px;font-size:var(--t-footnote);color:var(--muted);flex-wrap:wrap}
.mline b{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stepper button{height:50px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:var(--t-title2);font-weight:600}
.stepper .input{text-align:center;font-weight:700;font-size:var(--t-title3)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:360px){.presets{grid-template-columns:repeat(3,1fr)}}
.preset{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.preset:hover{border-color:var(--water);background:var(--water-soft)}
.preset svg{width:28px;height:28px;color:var(--water)}
.preset b{font-size:var(--t-subhead)}
.preset span{font-size:var(--t-caption2);color:var(--muted)}
.drinks{list-style:none;margin:0;padding:0}
.drinks li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.drinks li svg{width:18px;height:18px;color:var(--water);flex:none}
.drinks .dt{flex:1;color:var(--muted);font-size:var(--t-footnote)}
.photo{position:relative;border:2px dashed var(--line);border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:var(--sunk)}
.photo.has{border-style:solid;border-color:transparent}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-empty{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:16px;color:var(--muted);font-size:var(--t-footnote)}
.photo-empty svg{width:40px;height:40px;color:var(--accent);margin-bottom:4px}
.photo-empty b{color:var(--ink);font-size:var(--t-subhead)}
.photo.busy::after{content:"";position:absolute;left:0;right:0;top:0;height:28%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 45%,transparent) 85%,var(--accent));animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(360%)}}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.hint{background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--t-footnote);margin:0}
.est{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.est input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.est .em{flex:1;min-width:0}
.muted{color:var(--muted);font-size:var(--t-footnote)}
.err{color:var(--warn);font-size:var(--t-footnote)}
details{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
summary{font-weight:600;cursor:pointer}
details[open] summary{margin-bottom:12px}
.calcres{background:var(--accent-soft);border-radius:var(--r-sm);padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.calcres b{font-family:var(--f-display);font-size:var(--t-title3)}
.toast{position:fixed;left:50%;bottom:calc(146px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r-sm);font-weight:600;font-size:var(--t-subhead);width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}
</style>
<script>

  var ACCENTS=[
    {id:"himbeere",name:"Himbeere",l:"#B8336A",d:"#EE6D9F"},{id:"ozean",name:"Ozean",l:"#1F67C9",d:"#6CA8EE"},
    {id:"smaragd",name:"Smaragd",l:"#1C8456",d:"#56C68F"},{id:"orange",name:"Orange",l:"#CC5A0E",d:"#FF9A4D"},
    {id:"violett",name:"Violett",l:"#6A47D4",d:"#A894FF"},{id:"petrol",name:"Petrol",l:"#0E7480",d:"#4CC7D1"},
    {id:"bernstein",name:"Bernstein",l:"#A86A12",d:"#F2BE4E"},{id:"graphit",name:"Graphit",l:"#333C47",d:"#C5CDD6"}];
  var BGS={
    neutral:{name:"Neutral",l:["#F1F4F1","#FFFFFF","#E7ECE8","#DCE2DD"],d:["#111513","#1A1F1C","#232A26","#2B332E"]},
    sand:{name:"Sand",l:["#F4EFE6","#FFFDF8","#EAE3D6","#DFD6C7"],d:["#16130F","#201C17","#2A251F","#363028"]},
    eis:{name:"Eis",l:["#EDF2F8","#FFFFFF","#E1E8F1","#D4DDE9"],d:["#0E1318","#171E26","#202934","#2A3441"]},
    rose:{name:"Rosé",l:["#F7EEF1","#FFFFFF","#EEE1E6","#E4D2D9"],d:["#161012","#20181B","#2A2024","#36292F"]},
    kontrast:{name:"Kontrast",l:["#FFFFFF","#F3F4F3","#E8EAE8","#D9DCD9"],d:["#000000","#121212","#1D1D1D","#2A2A2A"]}};
  var FONTS={
    standard:{name:"Bricolage & Figtree",d:'"Bricolage Grotesque",ui-rounded,system-ui,sans-serif',b:'"Figtree",system-ui,sans-serif',css:null},

    elegant:{name:"Fraunces & DM Sans – elegant",d:'"Fraunces",Georgia,serif',b:'"DM Sans",system-ui,sans-serif',css:"family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700"},
    sportlich:{name:"Barlow – sportlich",d:'"Barlow Condensed","Arial Narrow",sans-serif',b:'"Barlow",system-ui,sans-serif',css:"family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700"},
    verspielt:{name:"Baloo 2 – verspielt",d:'"Baloo 2",ui-rounded,system-ui,sans-serif',b:'"Baloo 2",ui-rounded,system-ui,sans-serif',css:"family=Baloo+2:wght@400;500;600;700;800"},
    technisch:{name:"JetBrains Mono & Plex – technisch",d:'"JetBrains Mono",ui-monospace,monospace',b:'"IBM Plex Sans",system-ui,sans-serif',css:"family=JetBrains+Mono:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700"},
    system:{name:"Systemschrift",d:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',b:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',css:null}};
  var DEF_LOOK={theme:"system",accent:"himbeere",bg:"neutral",font:"standard",size:"normal",radius:"weich",grad:false};
  var loaded={};
  function ensureFont(k){var f=FONTS[k];if(!f||!f.css||loaded[k])return;loaded[k]=1;var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?"+f.css+"&display=swap";document.head.appendChild(l)}
  function hexToRgb(h){h=h.replace("#","");if(h.length===3)h=h.replace(/./g,"$&$&");var n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}

  function toHsl(c){var r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2;if(mx!==mn){var d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6}return[h,s,l]}

  function inkFor(hex){var L=lum(hex);return (1.05/(L+.05))>=((L+.05)/.05)?"#FFFFFF":"#141414"}
  function forLight(hex){var x=toHsl(hexToRgb(hex));return rgbToHex(fromHsl(x[0],x[1],Math.min(x[2],.46)))}
  function forDark(hex){var x=toHsl(hexToRgb(hex));return rgbToHex(fromHsl(x[0],Math.min(x[1],.85),Math.max(x[2],.68)))}
  function resolveAccent(a){if(a&&a.charAt(0)==="#")return{l:forLight(a),d:forDark(a)};for(var i=0;i<ACCENTS.length;i++)if(ACCENTS[i].id===a)return ACCENTS[i];return ACCENTS[0]}

    var L=Object.assign({},DEF_LOOK,look||{}),r=document.documentElement,s=r.style;
    var a=resolveAccent(L.accent);s.setProperty("--accent-l",a.l);s.setProperty("--accent-d",a.d);s.setProperty("--aink-l",inkFor(a.l));s.setProperty("--aink-d",inkFor(a.d));

  }

(function(){var c=null;try{c=JSON.parse(localStorage.getItem("kalorienbuch-look")||"null")}catch(e){}KB.applyLook(c||{})})();

<body>
<div id="glow"></div>
<div class="app">
  <!-- HEUTE -->
  <div class="view" id="view-today">
    <header class="top">
      <h1 class="brand">Kalorien<span>buch</span></h1>
      <div class="datebar">
        <button id="prevDay" aria-label="Vorheriger Tag"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="datelabel" id="dateLabel" aria-label="Zu heute springen">Heute</button>
        <button id="nextDay" aria-label="Nächster Tag"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </header>

    <section class="card summary" aria-label="Tagesübersicht">
      <div class="ring" id="ring" role="img">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="11"/><g id="ringSegs"></g></svg>
        <div class="ring-center"><div class="ring-num num" id="ringNum">2.000</div><div class="ring-cap" id="ringCap">kcal übrig</div></div>
      </div>
      <div class="stats">
        <div class="statrow"><span>Gegessen</span><b class="num" id="eaten">0 kcal</b></div>
        <div class="statrow"><span>Tagesziel</span><b class="num" id="goalTxt">2.000 kcal</b></div>
        <div id="macroBox" style="display:flex;flex-direction:column;gap:10px">
          <div class="macro m-p"><div class="macro-head"><span>Eiweiß</span><b class="num" id="pTxt">0 / 110 g</b></div><div class="meter"><i id="pBar" style="width:0"></i></div></div>
          <div class="macro m-c"><div class="macro-head"><span>Kohlenhydrate</span><b class="num" id="cTxt">0 / 230 g</b></div><div class="meter"><i id="cBar" style="width:0"></i></div></div>
          <div class="macro m-f"><div class="macro-head"><span>Fett</span><b class="num" id="fTxt">0 / 70 g</b></div><div class="meter"><i id="fBar" style="width:0"></i></div></div>
        </div>
      </div>
    </section>

    <section class="card water" id="waterCard" aria-label="Trinkzähler">
      <div class="w-vis">
        <svg viewBox="0 0 60 92" aria-hidden="true">
          <defs><clipPath id="glassClip"><path d="M7 5h46l-5.2 78a5 5 0 0 1-5 4.6H17.2a5 5 0 0 1-5-4.6z"/></clipPath></defs>
          <g clip-path="url(#glassClip)"><rect class="w-bg" x="0" y="0" width="60" height="92"/><rect class="w-fill" id="wFill" x="0" y="0" width="60" height="92" style="transform:translateY(92px)"/>
            <g class="w-ticks"><line x1="40" x2="50" y1="25" y2="25"/><line x1="40" x2="50" y1="46" y2="46"/><line x1="40" x2="50" y1="67" y2="67"/></g></g>
          <path class="w-outline" d="M7 5h46l-5.2 78a5 5 0 0 1-5 4.6H17.2a5 5 0 0 1-5-4.6z"/>
        </svg>
      </div>
      <div class="w-main">
        <div class="w-head"><h2>Trinken</h2><span class="w-pct num" id="wPct">0 %</span></div>
        <div class="w-num num"><b id="wNow">0</b> / <span id="wGoal">2.500</span> ml</div>
        <div class="w-quick" id="wQuick"></div>
      </div>
    </section>

    <div id="meals" class="view"></div>
  </div>

  <!-- VERLAUF -->
  <div class="view" id="view-history" hidden>
    <header class="top">
      <h1 class="brand">Verlauf</h1>
      <div class="seg" id="rangeSeg" style="min-width:150px"><button data-range="7" aria-pressed="true">7 Tage</button><button data-range="30" aria-pressed="false">30 Tage</button></div>
    </header>
    <div class="kpis" id="kpis"></div>
    <section class="card"><h2 class="sec">Kalorien <small id="kcalLegend">Linie = Tagesziel</small></h2><svg class="chart" id="kcalChart" viewBox="0 0 320 150" role="img" aria-label="Kalorien pro Tag"></svg></section>
    <section class="card"><h2 class="sec">Trinken <small id="waterLegend">Linie = Trinkziel</small></h2><svg class="chart waterc" id="waterChart" viewBox="0 0 320 150" role="img" aria-label="Getrunkene Menge pro Tag"></svg></section>
    <section class="card">
      <h2 class="sec">Gewicht <small id="weightLegend"></small></h2>
      <svg class="chart" id="weightChart" viewBox="0 0 320 150" role="img" aria-label="Gewichtsverlauf"></svg>
      <div class="wrow">
        <div class="field"><label for="wIn">Gewicht heute (kg)</label><input class="input num" id="wIn" inputmode="decimal" placeholder="z. B. 72,4"></div>
        <button class="btn small" id="wSave">Speichern</button>
      </div>
    </section>
  </div>

  <!-- PROFIL -->
  <div class="view" id="view-me" hidden>
    <header class="top"><h1 class="brand">Profil</h1></header>
    <div id="meBody" class="view"></div>
  </div>
  <p class="note" id="storeNote" style="margin-top:14px">Wird geladen …</p>
</div>

<div class="fabs" id="fabs">
  <button class="fabcam" id="fabCam" aria-label="Essen fotografieren" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg></button>
  <button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Eintragen</button>
</div>
<input type="file" id="camIn" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="galIn" class="vh" accept="image/*" tabindex="-1" aria-hidden="true">

<nav class="tabbar" aria-label="Bereiche"><div class="tabbar-in" role="tablist">
  <button class="tab" role="tab" data-view="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/><circle cx="12" cy="12" r="2.5"/></svg>Heute</button>
  <button class="tab" role="tab" data-view="history" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V9"/></svg>Verlauf</button>
  <button class="tab" role="tab" data-view="me" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>Profil</button>
</div></nav>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>

const svgI=(k,extra)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"'+(extra||"")+'>'+ICON[k]+'</svg>';

const state={days:{},settings:mergeSettings(),date:today(),mode:"local",view:"today",range:7};

const CAM_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>';

const TEXT_PROMPT="Du bist ein Ernährungsassistent. Schätze für die folgende Mahlzeitbeschreibung realistische Nährwerte nach deutschen Durchschnittsportionen. Zerlege sie in einzelne Bestandteile. Antworte NUR mit JSON in der Form {\"items\":[{\"name\":\"Weizenbrötchen\",\"gramm\":110,\"menge\":\"2 Stück (110 g)\",\"kcal\":297,\"protein\":10,\"kohlenhydrate\":58,\"fett\":2}]}. Namen auf Deutsch, Zahlen ohne Einheiten.\n\nMahlzeit: ";
const PHOTO_PROMPT="Du bist ein Ernährungsassistent. Das Foto zeigt eine Mahlzeit. Erkenne jedes einzelne Lebensmittel darauf und schätze die Menge in Gramm anhand von Tellergröße, Besteck, Verpackungen und typischen Portionen. Schätze dazu kcal, Eiweiß, Kohlenhydrate und Fett. Denk an versteckte Fette wie Öl, Butter, Dressing und Soßen. Antworte NUR mit JSON in dieser Form: {\"essen\":true,\"items\":[{\"name\":\"Spaghetti (gekocht)\",\"gramm\":250,\"menge\":\"1 Teller\",\"kcal\":375,\"protein\":13,\"kohlenhydrate\":75,\"fett\":2}],\"hinweis\":\"Ein kurzer Satz, was auf dem Foto schwer zu schätzen war.\"}. Wenn kein Essen zu sehen ist, antworte {\"essen\":false,\"items\":[]}. Namen auf Deutsch, Zahlen ohne Einheiten.";

const dirty=new Set();

// ---------- persistence ----------
function cacheWrite(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({days:state.days,settings:state.settings}))}catch(e){}}
function cacheRead(){try{const o=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(o){state.days={};Object.keys(o.days||{}).forEach(k=>state.days[k]=normDay(o.days[k]));state.settings=mergeSettings(o.settings)}}catch(e){}
  try{const v=localStorage.getItem("kalorienbuch-view");if(v==="today"||v==="history"||v==="me")state.view=v}catch(e){}}
const timers={},chains={};
function persist(docId,getBody){
  cacheWrite();
  if(state.mode!=="db")return;
  dirty.add(docId);
  clearTimeout(timers[docId]);
  timers[docId]=setTimeout(()=>{
    const ref=db.collection("data/users/"+userId).doc(docId);
    chains[docId]=(chains[docId]||Promise.resolve()).then(async()=>{
      try{await ref.set(getBody())}
      catch(e){
        if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await ref.set(getBody())}catch(e2){toast("Speichern fehlgeschlagen. Später erneut versuchen.")}}
        else if(e&&e.code==="quota_exceeded")toast("Speicher voll. Alte Tage löschen.");
        else toast("Speichern fehlgeschlagen.");
      }finally{dirty.delete(docId)}
    });
  },500);
}
const day=(d,create)=>{if(!state.days[d]){const o=normDay(null);if(!create)return o;state.days[d]=o}return state.days[d]};
function saveDay(date){const id="d-"+date;persist(id,()=>{const o=day(date);return{date,entries:o.entries,water:o.water,weight:o.weight}})}
function saveSettings(){persist("settings",()=>JSON.parse(JSON.stringify(state.settings)))}

async function connect(){
  if(!window.claude||!window.claude.use){setNote();return}
  const use=n=>window.claude.use(n).catch(()=>null);
  const [d,u,s,dl]=await Promise.all([use("db"),use("user"),use("sample"),use("downloads")]);
  sample=s;downloads=dl;
  if(sample&&sample.limits){try{const l=await sample.limits();imageCaps=l&&l.images||null}catch(e){imageCaps=null}}
  applyImageCaps();
  if(d&&u){try{userId=await u.id()}catch(e){userId=null}}
  if(d&&userId){
    db=d;state.mode="db";
    db.collection("data/users/"+userId).onSnapshot(snap=>{
      const days={};let settings=null;
      snap.docs.forEach(doc=>{const v=doc.data();if(!v)return;
        if(doc.id==="settings")settings=v;else if(doc.id.startsWith("d-"))days[doc.id.slice(2)]=normDay(JSON.parse(JSON.stringify(v)));});
      if(snap.empty&&!snap.metadata.fromCache&&Object.keys(state.days).length){
        // first run with the account store: move what this device kept into it
        Object.keys(state.days).forEach(saveDay);saveSettings();return;
      }
      Object.keys(days).forEach(k=>{if(!dirty.has("d-"+k))state.days[k]=days[k]});
      if(!snap.metadata.fromCache)Object.keys(state.days).forEach(k=>{if(!(k in days)&&!dirty.has("d-"+k))delete state.days[k]});
      if(settings&&!dirty.has("settings")){state.settings=mergeSettings(settings);KB.applyLook(state.settings.look)}
      cacheWrite();renderAll(true);
    },()=>{state.mode="local";setNote()});
  }
  setNote();
  if(state.view==="me")renderMe();
  if(!$("overlay").hidden&&sheet.view==="add")drawSheet();
}
function applyImageCaps(){
  const acc=imageCaps&&imageCaps.mediaTypes&&imageCaps.mediaTypes.length?imageCaps.mediaTypes.join(","):"image/*";
  $("camIn").accept=acc;$("galIn").accept=acc;
  $("fabCam").hidden=!imageCaps;
}
function setNote(){$("storeNote").textContent=state.mode==="db"?"Deine Einträge sind privat in deinem Konto gespeichert.":"Einträge werden nur auf diesem Gerät gespeichert."}

// ---------- calc ----------
const sum=list=>list.reduce((a,e)=>({k:a.k+e.kcal,p:a.p+(e.p||0),c:a.c+(e.c||0),f:a.f+(e.f||0)}),{k:0,p:0,c:0,f:0});
const waterSum=d=>day(d).water.reduce((a,w)=>a+w.ml,0);
function defaultMeal(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?"fruehstueck":h<14.5?"mittag":h<17.5?"snacks":"abend"}
function fromFood(f,g){const r=g/100;return{name:f.name,kcal:Math.round(f.k*r),p:+(f.p*r).toFixed(1),c:+(f.c*r).toFixed(1),f:+(f.f*r).toFixed(1),g:Math.round(g),per:{k:f.k,p:f.p,c:f.c,f:f.f,pg:f.pg,pl:f.pl}}}
function streak(){let d=today(),n=0;if(!day(d).entries.length)d=addDays(d,-1);while(day(d).entries.length){n++;d=addDays(d,-1)}return n}

// ---------- render ----------
function renderAll(fromSnap){renderToday();if(state.view==="history")renderHistory();if(state.view==="me"&&!fromSnap)renderMe()}
function renderToday(){
  const d=state.date,t=today(),o=day(d),list=o.entries,tot=sum(list),S=state.settings;
  const dd=parseIso(d);
  const wd=dd.toLocaleDateString("de-DE",{weekday:"long"}),dm=dd.toLocaleDateString("de-DE",{day:"numeric",month:"long"});
  $("dateLabel").innerHTML=(d===t?"Heute":d===addDays(t,-1)?"Gestern":esc(wd))+"<small>"+esc(dm)+"</small>";
  $("nextDay").disabled=d>=t;
  const left=S.goal-tot.k;
  $("ring").classList.toggle("over",left<0);
  // one arc per meal, in meal order, scaled so the full circle is the daily goal
  const C=326.73,scl=tot.k>0?Math.min(tot.k/Math.max(S.goal,1),1)*C/tot.k:0,gap=2;let pos=0;
  $("ringSegs").innerHTML=MEALS.map((m,i)=>({i,k:sum(list.filter(e=>e.meal===m.id)).k})).filter(x=>x.k>0).map(x=>{
    const len=Math.max(x.k*scl-gap,1.5),h='<circle class="arc m'+x.i+'" cx="60" cy="60" r="52" stroke-dasharray="'+len.toFixed(2)+' '+C+'" stroke-dashoffset="'+(-pos).toFixed(2)+'"/>';pos+=x.k*scl;return h}).join("");
  $("ring").setAttribute("aria-label",left<0?nf.format(-left)+" kcal über dem Tagesziel":nf.format(left)+" kcal übrig von "+nf.format(S.goal));
  $("ringNum").textContent=nf.format(Math.abs(left));
  $("ringCap").textContent=left<0?"kcal zu viel":"kcal übrig";
  $("eaten").textContent=nf.format(tot.k)+" kcal";
  $("goalTxt").textContent=nf.format(S.goal)+" kcal";
  $("macroBox").hidden=!S.show.macros;
  ["p","c","f"].forEach(k=>{$(k+"Txt").textContent=nf.format(tot[k])+" / "+nf.format(S[k])+" g";$(k+"Bar").style.width=Math.min(100,tot[k]/Math.max(S[k],1)*100)+"%"});
  // water
  $("waterCard").hidden=!S.show.water;
  const w=waterSum(d),wr=Math.min(w/Math.max(S.water,1),1);
  $("wFill").style.transform="translateY("+(92*(1-wr)).toFixed(1)+"px)";
  $("wNow").textContent=nf.format(w);$("wGoal").textContent=nf.format(S.water);
  $("wPct").textContent=w>=S.water?"Ziel erreicht":nf.format(w/Math.max(S.water,1)*100)+" %";
  $("wQuick").innerHTML=QUICK.map(ml=>'<button class="wbtn" data-water="'+ml+'" aria-label="'+ml+' ml hinzufügen">'+svgI(iconForMl(ml))+'+'+ml+'</button>').join("")+
    '<button class="wbtn icon" data-water-more aria-label="Andere Menge">'+svgI("carafe")+'Mehr</button>'+
    '<button class="wbtn icon" data-water-undo aria-label="Letztes Getränk entfernen"'+(o.water.length?"":" disabled")+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>';
  // meals
  const y=day(addDays(d,-1)).entries;
  $("meals").innerHTML=MEALS.map(m=>{
    const es=list.filter(e=>e.meal===m.id),mk=sum(es).k,ye=y.filter(e=>e.meal===m.id);
    return '<section class="card meal"><div class="meal-head"><h2><i class="mdot m'+MEALS.indexOf(m)+'" aria-hidden="true"></i>'+m.label+'</h2><span class="kc num">'+nf.format(mk)+' <small>kcal</small></span></div>'+
      (es.length?'<ul class="entries">'+es.map(e=>'<li class="entry"><button class="entry-main" data-edit="'+esc(e.id)+'"><div class="entry-name">'+esc(e.name)+'</div><div class="entry-sub num">'+
        (e.g?nf.format(e.g)+" g · ":"")+"E "+nf.format(e.p||0)+" · K "+nf.format(e.c||0)+" · F "+nf.format(e.f||0)+'</div></button><span class="entry-k num">'+nf.format(e.kcal)+'</span><button class="del" data-del="'+esc(e.id)+'" aria-label="'+esc(e.name)+' löschen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>').join("")+'</ul>'
        :'<div class="empty-hint"><span>Noch nichts eingetragen.</span>'+(ye.length?'<button class="copybtn num" data-copy="'+m.id+'">Wie gestern · '+nf.format(sum(ye).k)+' kcal</button>':'')+'</div>')+
      '<button class="addrow" data-add="'+m.id+'"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'+m.label+' hinzufügen</button></section>';
  }).join("");
}

function barChart(svg,days,vals,goal,fmt){
  const n=days.length,W=320,top=8,base=118,h=base-top,step=W/n,bw=n<=7?28:Math.max(4,step-3.5),rx=n<=7?8:3;
  const max=Math.max(goal*1.25,...vals,1),y=v=>base-v/max*h;
  let s='<line class="goal" x1="0" x2="'+W+'" y1="'+y(goal).toFixed(1)+'" y2="'+y(goal).toFixed(1)+'"/>';
  days.forEach((d,i)=>{
    const x=i*step+(step-bw)/2,v=vals[i],bh=v/max*h,cx=(x+bw/2).toFixed(1),dt=parseIso(d),sel=d===state.date;
    s+='<g class="day'+(sel?" sel":"")+'" data-day="'+d+'"><rect class="bg" x="'+x.toFixed(1)+'" y="'+top+'" width="'+bw.toFixed(1)+'" height="'+h+'" rx="'+rx+'" opacity="'+(sel?1:.55)+'"/>'+
      (v>0?'<rect class="v'+(v>goal&&fmt==="kcal"?" over":"")+'" x="'+x.toFixed(1)+'" y="'+(base-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="'+Math.min(rx,bh/2).toFixed(1)+'"/>':'');
    if(n<=7){
      s+='<text class="lbl" x="'+cx+'" y="136" text-anchor="middle">'+esc(dt.toLocaleDateString("de-DE",{weekday:"short"}).replace(".",""))+'</text>'+
        '<text x="'+cx+'" y="149" text-anchor="middle" font-size="10">'+(v?(fmt==="ml"?nf1.format(v/1000)+" l":nf.format(v)):"–")+'</text>';
    }else if(i%5===n%5||i===n-1){
      s+='<text class="lbl" x="'+cx+'" y="136" text-anchor="middle">'+dt.getDate()+'.'+(dt.getMonth()+1)+'.</text>';
    }
    s+='</g>';
  });
  svg.innerHTML=s;
}
function renderHistory(){
  const S=state.settings,n=state.range,t=today(),days=[];for(let i=n-1;i>=0;i--)days.push(addDays(t,-i));
  document.querySelectorAll("#rangeSeg button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.range===n)));
  const kc=days.map(d=>sum(day(d).entries).k),wa=days.map(waterSum);
  const logged=kc.filter(v=>v>0),wlog=wa.filter(v=>v>0);
  const avg=logged.length?logged.reduce((a,b)=>a+b,0)/logged.length:0;
  const inGoal=logged.filter(v=>v<=S.goal*1.05).length;
  const wavg=wlog.length?wlog.reduce((a,b)=>a+b,0)/wlog.length:0;
  const st=streak();

function renderWeight(){
  const pts=Object.keys(state.days).filter(d=>typeof state.days[d].weight==="number").sort().slice(-30).map(d=>({d,v:state.days[d].weight}));
  const svg=$("weightChart"),W=320,H=150,l=34,r=10,tp=12,bt=128;
  const tw=day(today()).weight;
  if(document.activeElement!==$("wIn"))$("wIn").value=tw!=null?nf1.format(tw):"";
  if(pts.length<2){
    svg.innerHTML='<text x="160" y="72" text-anchor="middle" font-size="13">'+(pts.length?"Ab dem zweiten Eintrag siehst du hier deine Kurve.":"Trag unten dein Gewicht ein, um den Verlauf zu sehen.")+'</text>';
    $("weightLegend").textContent=pts.length?nf1.format(pts[0].v)+" kg":"";return;
  }
  let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));mn=Math.floor(mn-.5);mx=Math.ceil(mx+.5);
  const t0=parseIso(pts[0].d).getTime(),t1=parseIso(pts[pts.length-1].d).getTime();
  const X=p=>l+(t1===t0?0.5:(parseIso(p.d).getTime()-t0)/(t1-t0))*(W-l-r),Y=v=>bt-(v-mn)/(mx-mn)*(bt-tp);
  let s='';
  [mn,(mn+mx)/2,mx].forEach(v=>{s+='<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(l-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+nf1.format(v)+'</text>'});
  const line=pts.map(p=>X(p).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
  s+='<polygon class="warea" points="'+X(pts[0]).toFixed(1)+','+bt+' '+line+' '+X(pts[pts.length-1]).toFixed(1)+','+bt+'"/>';
  s+='<polyline class="wline" points="'+line+'"/>';
  const last=pts[pts.length-1];
  s+='<circle class="wdot" cx="'+X(last).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+'" r="5"/>';
  const fd=p=>{const d=parseIso(p.d);return d.getDate()+"."+(d.getMonth()+1)+"."};
  s+='<text x="'+l+'" y="146">'+fd(pts[0])+'</text><text x="'+(W-r)+'" y="146" text-anchor="end">'+fd(last)+'</text>';
  svg.innerHTML=s;
  const delta=last.v-pts[0].v;
  $("weightLegend").textContent=nf1.format(last.v)+" kg · "+(delta===0?"unverändert":(delta>0?"+":"−")+nf1.format(Math.abs(delta))+" kg seit "+fd(pts[0]));
}

function addWater(ml){
  ml=Math.round(ml);if(!(ml>0))return;
  const d=state.date,before=waterSum(d);day(d,true).water.push({id:uid(),ml,t:Date.now()});saveDay(d);renderToday();
  const g=state.settings.water;
  if(before<g&&before+ml>=g)toast("Trinkziel erreicht – "+nf1.format((before+ml)/1000)+" l");else toast("+"+ml+" ml");
}

function recents(){
  const seen=new Map();
  Object.keys(state.days).sort().reverse().forEach(d=>state.days[d].entries.slice().reverse().forEach(e=>{if(!seen.has(e.name))seen.set(e.name,e)}));

}
function exportCsv(){
  if(!downloads)return;
  const q=v=>{v=String(v==null?"":v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},dn=v=>v==null||v===""?"":String(v).replace(".",",");
  const rows=[["Datum","Typ","Mahlzeit","Bezeichnung","Menge","kcal","Eiweiß g","KH g","Fett g"]];
  Object.keys(state.days).sort().forEach(d=>{const o=day(d);
    o.entries.forEach(e=>rows.push([d,"Essen",(MEALS.find(m=>m.id===e.meal)||{label:""}).label,e.name,e.g?e.g+" g":"",e.kcal,dn(e.p),dn(e.c),dn(e.f)]));
    o.water.forEach(w=>rows.push([d,"Trinken","","Wasser",w.ml+" ml","","","",""]));
    if(o.weight!=null)rows.push([d,"Gewicht","","",dn(o.weight)+" kg","","","",""]);});
  downloads.save({filename:"kalorienbuch-"+today()+".csv",data:"﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")})
    .then(r=>{if(r&&r.status==="saved")toast("Export gespeichert")})
    .catch(e=>{if(e&&e.code==="unavailable"){downloads=null;renderMe()}else toast("Export nicht gespeichert")});
}

      '<button class="btn" id="amSave">'+(sheet.editId?"Speichern":"Hinzufügen")+'</button>';
    const upd=()=>{const g=num($("amG").value);sheet.grams=g;const e=fromFood(f,g);$("amK").textContent=nf.format(e.kcal);
      $("amM").innerHTML='<span><i class="dot" style="background:var(--prot)"></i>Eiweiß <b>'+nf1.format(e.p)+' g</b></span><span><i class="dot" style="background:var(--carb)"></i>KH <b>'+nf1.format(e.c)+' g</b></span><span><i class="dot" style="background:var(--fat)"></i>Fett <b>'+nf1.format(e.f)+' g</b></span>';
      $("amSave").disabled=!(g>0)};
    $("amG").addEventListener("input",upd);
    $("amMinus").onclick=()=>{$("amG").value=Math.max(0,num($("amG").value)-10);upd()};
    $("amPlus").onclick=()=>{$("amG").value=num($("amG").value)+10;upd()};
    b.querySelectorAll("[data-g]").forEach(c=>c.onclick=()=>{$("amG").value=c.dataset.g;upd()});
    $("amSave").onclick=()=>{const e=fromFood(f,sheet.grams);
      if(sheet.editId){updateEntry(sheet.editId,e);toast("Gespeichert")}else{addEntry({...e,meal:sheet.meal});toast(f.name+" hinzugefügt");if(sheet.photo){setPhoto(null);sheet.estText=""}}
      closeSheet()};
    upd();
  }else if(sheet.view==="editFixed"){
    const e=day(state.date).entries.find(x=>x.id===sheet.editId);if(!e){closeSheet();return}
    $("sheetTitle").textContent="Eintrag bearbeiten";
    b.innerHTML='<div class="field"><label for="oName">Bezeichnung</label><input class="input" id="oName" value="'+esc(e.name)+'"></div>'+
      '<div class="field"><label for="oK">Kalorien (kcal)</label><input class="input num" id="oK" inputmode="decimal" value="'+e.kcal+'"></div>'+
      '<div class="grid3"><div class="field"><label for="oP">Eiweiß g</label><input class="input num" id="oP" inputmode="decimal" value="'+(e.p||0)+'"></div><div class="field"><label for="oC">KH g</label><input class="input num" id="oC" inputmode="decimal" value="'+(e.c||0)+'"></div><div class="field"><label for="oF">Fett g</label><input class="input num" id="oF" inputmode="decimal" value="'+(e.f||0)+'"></div></div>'+
      '<div class="field"><span class="lbl">Mahlzeit</span><div class="seg">'+MEALS.map((m,i)=>'<button data-emeal="'+m.id+'" aria-pressed="'+(e.meal===m.id)+'"><i class="mdot m'+i+'" aria-hidden="true"></i>'+m.short+'</button>').join("")+'</div></div>'+
      '<button class="btn" id="eSave">Speichern</button>';
    let meal=e.meal;
    b.querySelectorAll("[data-emeal]").forEach(c=>c.onclick=()=>{meal=c.dataset.emeal;b.querySelectorAll("[data-emeal]").forEach(x=>x.setAttribute("aria-pressed",String(x===c)))});
    $("eSave").onclick=()=>{updateEntry(e.id,{name:$("oName").value.trim()||e.name,kcal:Math.round(num($("oK").value)),p:num($("oP").value),c:num($("oC").value),f:num($("oF").value),meal});toast("Gespeichert");closeSheet()};
  }else if(sheet.view==="water"){
    const o=day(state.date),w=waterSum(state.date),g=state.settings.water;
    $("sheetTitle").textContent="Trinken · "+nf1.format(w/1000)+" von "+nf1.format(g/1000)+" l";
    b.innerHTML='<div class="presets">'+PRESETS.map(p=>'<button class="preset" data-water="'+p.ml+'">'+svgI(p.i)+'<b class="num">'+p.ml+' ml</b><span>'+p.name+'</span></button>').join("")+'</div>'+
      '<div class="field"><label for="mlIn">Eigene Menge (ml)</label><div class="stepper"><button id="mlMinus" aria-label="50 ml weniger">−</button><input class="input num" id="mlIn" inputmode="numeric" value="'+sheet.ml+'"><button id="mlPlus" aria-label="50 ml mehr">+</button></div></div>'+
      '<button class="btn" id="mlAdd">Hinzufügen</button>'+
      (o.water.length?'<div><div class="listlabel">Heute getrunken</div><ul class="drinks">'+o.water.slice().reverse().map(x=>'<li>'+svgI(iconForMl(x.ml))+'<b class="num">'+x.ml+' ml</b><span class="dt num">'+new Date(x.t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+' Uhr</span><button class="del" data-wdel="'+esc(x.id)+'" aria-label="'+x.ml+' ml entfernen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>').join("")+'</ul></div>'
        :'<p class="muted" style="margin:0">Noch nichts getrunken. Tipp auf eine Größe, um sie einzutragen.</p>');
    const ml=$("mlIn");ml.addEventListener("input",()=>{sheet.ml=num(ml.value)});
    $("mlMinus").onclick=()=>{ml.value=Math.max(0,num(ml.value)-50);sheet.ml=num(ml.value)};
    $("mlPlus").onclick=()=>{ml.value=num(ml.value)+50;sheet.ml=num(ml.value)};
    $("mlAdd").onclick=()=>{if(num(ml.value)>0){addWater(num(ml.value));drawSheet()}};
  }
}
function drawFoods(){
  const q=sheet.q.trim().toLowerCase(),box=$("foodres");if(!box)return;
  const row=(attr,name,sub,k)=>'<li><button class="food" '+attr+'><span class="fn">'+esc(name)+'<div class="fs">'+esc(sub)+'</div></span><span class="fk num">'+k+'</span></button></li>';
  let h="";
  const rec=recents().filter(e=>!q||e.name.toLowerCase().includes(q));
  if(rec.length)h+='<div class="listlabel">Zuletzt</div><ul class="foodlist">'+rec.map(e=>row('data-recent="'+esc(e.name)+'"',e.name,e.per?"je 100 g · zuletzt "+nf.format(e.g)+" g":"1 Portion",e.per?nf.format(e.per.k)+" kcal":nf.format(e.kcal)+" kcal")).join("")+'</ul>';
  const fs=FOODS.filter(f=>!q||f.name.toLowerCase().includes(q));
  if(fs.length)h+='<div class="listlabel">Lebensmittel</div><ul class="foodlist">'+fs.map(f=>row('data-food="'+esc(f.name)+'"',f.name,"je 100 g · 1 "+f.pl+" = "+f.pg+" g",nf.format(f.k)+" kcal")).join("")+'</ul>';
  if(!h)h='<p class="muted">Nichts gefunden. Lege es unter <b>Eigener Eintrag</b> an'+(sample?' oder lass <b>Claude</b> schätzen':'')+'.</p>';
  box.innerHTML=h;
}
const toItem=x=>{const g=Math.max(0,Math.round(num(x.gramm))),it={name:String(x.name||"Unbekannt").slice(0,60),menge:String(x.menge||"").slice(0,40),kcal:Math.max(0,Math.round(num(x.kcal))),p:Math.max(0,num(x.protein)),c:Math.max(0,num(x.kohlenhydrate)),f:Math.max(0,num(x.fett)),g,on:true};
  if(g>0&&it.kcal>0)it.per={k:+(it.kcal/g*100).toFixed(1),p:+(it.p/g*100).toFixed(1),c:+(it.c/g*100).toFixed(1),f:+(it.f/g*100).toFixed(1),pg:g,pl:"Portion"};
  return it};
async function runEstimate(){
  const text=sheet.estText.trim(),photo=imageCaps?sheet.photo:null;
  if(!sample||(!text&&!photo))return;
  sheet.estBusy=true;sheet.estErr="";sheet.est=null;sheet.hint="";drawSheet();
  try{
    if(photo&&sheet.scanMode==="etikett"){
      const r=await sample.json(LABEL_PROMPT+(text?"\n\nHinweis vom Nutzer: "+text:""),{images:[photo]});
      if(!r||r.lesbar===false||!(num(r.kcal_100)>0)){sheet.estErr="Die Werte waren nicht lesbar. Fotografiere die Tabelle gerade, scharf und ohne Spiegelung.";return}
      const pg=Math.round(num(r.portion_g))||100;
      sheet.food={name:String(r.name||"Gescanntes Produkt").slice(0,60),k:Math.round(num(r.kcal_100)),p:+num(r.protein_100).toFixed(1),c:+num(r.kohlenhydrate_100).toFixed(1),f:+num(r.fett_100).toFixed(1),pg,pl:String(r.portion_name||"Portion").slice(0,20)};
      sheet.grams=pg;sheet.view="amount";drawSheet();return;
    }
    const opts=photo?{images:[photo]}:{modelTier:"quick"};
    const res=await sample.json(photo?PHOTO_PROMPT+(text?"\n\nZusatzinfo vom Nutzer: "+text:""):TEXT_PROMPT+text,opts);
    if(photo&&res&&res.essen===false){sheet.estErr="Auf dem Foto ist kein Essen zu erkennen. Versuch es mit einem anderen Bild.";return}
    const items=(res&&Array.isArray(res.items)?res.items:[]).map(toItem).filter(x=>x.kcal>0);
    sheet.est=items;sheet.hint=res&&typeof res.hinweis==="string"?res.hinweis.slice(0,200):"";
    if(!items.length)sheet.estErr=photo?"Claude konnte auf dem Foto nichts schätzen. Versuch ein helleres Bild von schräg oben.":"Claude konnte daraus nichts schätzen. Beschreibe die Mahlzeit genauer.";
  }catch(e){
    const c=e&&e.code;
    sheet.estErr=c==="rate_limited"?"Gerade zu viele Anfragen oder dein Nutzungslimit ist erreicht. Versuch es später erneut.":c==="not_granted"?"Claude ist für diese App nicht freigegeben.":c==="image_rejected"?"Dieses Bild geht nicht. Nimm ein JPEG- oder PNG-Foto.":c==="images_unavailable"?"Fotos gehen hier gerade nicht. Beschreib dein Essen stattdessen als Text.":c==="refused"?"Claude kann diese Anfrage nicht auswerten.":c==="session_expired"?"Bitte melde dich neu an und versuch es erneut.":"Schätzung fehlgeschlagen. Versuch es erneut.";
    if(c==="not_granted")sample=null;
    if(c==="images_unavailable"){imageCaps=null;applyImageCaps()}
  }finally{sheet.estBusy=false;if(!$("overlay").hidden&&sheet.view==="add")drawSheet()}
}
function onPicked(input){
  const file=input.files&&input.files[0];input.value="";if(!file)return;
  if(imageCaps&&imageCaps.maxInputBytes&&file.size>imageCaps.maxInputBytes){toast("Das Foto ist zu groß.");return}
  setPhoto(file);
  if($("overlay").hidden||sheet.view!=="add"||sheet.tab!=="ai"){openSheet("add",{tab:"ai"})}else drawSheet();
  runEstimate();
}

// ---------- events ----------
$("prevDay").onclick=()=>{state.date=addDays(state.date,-1);renderToday()};
$("nextDay").onclick=()=>{if(state.date<today()){state.date=addDays(state.date,1);renderToday()}};
$("dateLabel").onclick=()=>{state.date=today();renderToday()};
$("fab").onclick=()=>openSheet("add",{meal:defaultMeal(),editId:null,q:""});
$("fabCam").onclick=()=>{openSheet("add",{meal:defaultMeal(),editId:null,tab:"ai",scanMode:"teller"});$("camIn").click()};
$("camIn").addEventListener("change",()=>onPicked($("camIn")));
$("galIn").addEventListener("change",()=>onPicked($("galIn")));
$("sheetClose").onclick=closeSheet;
$("sheetBack").onclick=()=>{sheet.view="add";drawSheet()};
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeSheet()});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>showView(t.dataset.view));
$("waterCard").addEventListener("click",e=>{
  const w=e.target.closest("[data-water]");if(w){addWater(+w.dataset.water);return}
  if(e.target.closest("[data-water-more]")){openSheet("water",{});return}
  if(e.target.closest("[data-water-undo]"))removeWater(null);
});
$("meals").addEventListener("click",e=>{
  const a=e.target.closest("[data-add]"),dl=e.target.closest("[data-del]"),ed=e.target.closest("[data-edit]"),cp=e.target.closest("[data-copy]");
  if(a)openSheet("add",{meal:a.dataset.add,editId:null,q:""});
  else if(dl)deleteEntry(dl.dataset.del);
  else if(cp)copyMeal(cp.dataset.copy);
  else if(ed){const en=day(state.date).entries.find(x=>x.id===ed.dataset.edit);if(!en)return;
    if(en.per)openSheet("amount",{food:{name:en.name,...en.per},grams:en.g,editId:en.id});else openSheet("editFixed",{editId:en.id})}
});
["kcalChart","waterChart"].forEach(id=>$(id).addEventListener("click",e=>{const g=e.target.closest("[data-day]");if(g){state.date=g.dataset.day;renderToday();showView("today")}}));
$("rangeSeg").addEventListener("click",e=>{const b=e.target.closest("[data-range]");if(b){state.range=+b.dataset.range;renderHistory()}});
$("wSave").onclick=()=>{const v=num($("wIn").value);if(!(v>20&&v<400)){toast("Bitte ein Gewicht in kg eingeben");return}
  day(today(),true).weight=Math.round(v*10)/10;saveDay(today());$("wIn").blur();renderWeight();toast("Gewicht gespeichert")};
$("meBody").addEventListener("click",e=>{
  const t=e.target;
  const lk=t.closest("[data-look]");if(lk){setLook({[lk.dataset.look]:lk.dataset.val});renderMe();return}
  const lt=t.closest("[data-look-toggle]");if(lt){const k=lt.dataset.lookToggle;setLook({[k]:!state.settings.look[k]});lt.setAttribute("aria-checked",String(!!state.settings.look[k]));return}
  const sh=t.closest("[data-show]");if(sh){const k=sh.dataset.show;state.settings.show={...state.settings.show,[k]:!state.settings.show[k]};sh.setAttribute("aria-checked",String(state.settings.show[k]));saveSettings();renderToday();return}
  if(t.id==="resetLook"){setLook({...KB.DEF_LOOK});renderMe();toast("Design zurückgesetzt");return}
  if(t.id==="exportCsv")exportCsv();
});
$("meBody").addEventListener("input",e=>{if(e.target.id==="customColor")KB.applyLook({...state.settings.look,accent:e.target.value})});
$("meBody").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="customColor"){setLook({accent:t.value});renderMe();return}
  if(t.dataset.goal){const k=t.dataset.goal,v=Math.round(num(t.value)),min=k==="goal"?800:k==="water"?250:0;
    if(!(v>=min)){t.value=state.settings[k];toast(k==="goal"?"Bitte mindestens 800 kcal eingeben":k==="water"?"Bitte mindestens 250 ml eingeben":"Bitte eine Zahl eingeben");return}
    state.settings[k]=v;saveSettings();renderToday();toast("Gespeichert")}
});
$("sheetBody").addEventListener("click",e=>{
  const t=e.target;
  const m=t.closest("[data-meal]");if(m){sheet.meal=m.dataset.meal;document.querySelectorAll("[data-meal]").forEach(x=>x.setAttribute("aria-pressed",String(x===m)));return}
  const tb=t.closest("[data-tab]");if(tb){sheet.tab=tb.dataset.tab;drawSheet();return}
  const pk=t.closest("[data-pick]");if(pk){$(pk.dataset.pick).click();return}
  const sm=t.closest("[data-scanmode]");if(sm){if(sheet.scanMode!==sm.dataset.scanmode){sheet.scanMode=sm.dataset.scanmode;sheet.est=null;sheet.hint="";sheet.estErr=""}drawSheet();return}
  const wp=t.closest("[data-water]");if(wp){addWater(+wp.dataset.water);drawSheet();return}
  const wd=t.closest("[data-wdel]");if(wd){removeWater(wd.dataset.wdel);drawSheet();return}
  const fd=t.closest("[data-food]");if(fd){const f=FOODS.find(x=>x.name===fd.dataset.food);sheet.food=f;sheet.grams=f.pg;sheet.view="amount";drawSheet();return}
  const rc=t.closest("[data-recent]");if(rc){const r=recents().find(x=>x.name===rc.dataset.recent);if(!r)return;
    if(r.per){sheet.food={name:r.name,...r.per};sheet.grams=r.g;sheet.view="amount";drawSheet()}
    else{addEntry({name:r.name,kcal:r.kcal,p:r.p,c:r.c,f:r.f,meal:sheet.meal});closeSheet();toast(r.name+" hinzugefügt")}return}
  if(t.id==="oAdd"){const n=$("oName").value.trim(),k=Math.round(num($("oK").value));
    if(!n||!(k>0)){toast("Bitte Bezeichnung und Kalorien angeben");return}
    addEntry({name:n,kcal:k,p:num($("oP").value),c:num($("oC").value),f:num($("oF").value),meal:sheet.meal});closeSheet();toast(n+" hinzugefügt");return}
  if(t.closest("#aiGo")){runEstimate();return}
  if(t.id==="aiAdd"){const sel=sheet.est.filter(x=>x.on);sel.forEach(x=>addEntry({name:x.name,kcal:x.kcal,p:x.p,c:x.c,f:x.f,meal:sheet.meal,...(x.per?{g:x.g,per:x.per}:{})}));
    sheet.est=null;sheet.estText="";setPhoto(null);closeSheet();toast(sel.length+(sel.length===1?" Eintrag":" Einträge")+" hinzugefügt");return}
});
$("sheetBody").addEventListener("change",e=>{const c=e.target.closest("[data-est]");if(c){sheet.est[+c.dataset.est].on=c.checked;drawSheet()}});

let toastTimer;
function toast(msg,undo){
  const el=$("toast");clearTimeout(toastTimer);el.innerHTML="";
  const s=document.createElement("span");s.textContent=msg;el.appendChild(s);
  if(undo){const b=document.createElement("button");b.textContent="Rückgängig";b.onclick=()=>{undo();el.hidden=true};el.appendChild(b)}
  el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,undo?4500:2200);
}

// drag the grabber or header down to dismiss the sheet
(function(){
  const sh=document.querySelector(".sheet");let y0=null,dy=0,t0=0;
  const down=e=>{if(e.target.closest("button"))return;y0=e.clientY;dy=0;t0=Date.now();sh.style.transition="none"};
  const move=e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform="translateY("+dy+"px)"};
  const up=()=>{if(y0==null)return;y0=null;const fast=dy>30&&dy/Math.max(1,Date.now()-t0)>.5;
    sh.style.transition="transform .2s cubic-bezier(.2,.8,.2,1)";
    if(dy>110||fast){sh.style.transform="translateY(100%)";setTimeout(closeSheet,200)}else sh.style.transform=""};
  [".grab",".sheet-head"].forEach(q=>document.querySelector(q).addEventListener("pointerdown",down));
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
})();

// day rollover while the app stays open
let lastToday=today();
setInterval(()=>{const t=today();if(t!==lastToday){if(state.date===lastToday)state.date=t;lastToday=t;renderAll()}},60000);

cacheRead();KB.applyLook(state.settings.look);renderToday();showView(state.view);connect();
})();
